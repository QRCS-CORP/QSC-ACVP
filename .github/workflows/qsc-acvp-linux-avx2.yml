# Standalone manual-only ACVP qualification workflow; no scheduled or push triggers.
name: QSC ACVP Linux x64 avx2-aesni offline bootstrap

on:
  workflow_dispatch:
    inputs:
      qsc_ref:
        description: 'Immutable 40-character QSC source commit to qualify'
        type: string
        required: true
        default: 43c8aa2afe9d38c3ddf9bac0107196545981ac28

permissions:
  contents: read

concurrency:
  group: qsc-acvp-sequential-qualification
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  linux-avx2-aesni:
    name: Linux x64 avx2-aesni offline SHA/AES bootstrap
    if: github.repository == 'QRCS-CORP/QSC-ACVP'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed qualification revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pinned QSC dependency (read-only)
        uses: actions/checkout@v4
        with:
          repository: QRCS-CORP/QSC
          ref: ${{ inputs.qsc_ref }}
          path: dependency/QSC
          persist-credentials: false

      - name: Verify QSC revision and native x64 runner
        shell: bash
        env:
          QSC_REQUESTED_SHA: ${{ inputs.qsc_ref }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          if [[ ! "$QSC_REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'QSC source must be pinned to an immutable 40-character SHA' >&2
            exit 1
          fi
          sha="$(git -C dependency/QSC rev-parse HEAD)"
          test "$sha" = "$QSC_REQUESTED_SHA"
          printf 'QSC_DEPENDENCY_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          printf 'QSC source commit: %s\n' "$sha"
          printf 'Qualification commit: %s\n' "$(git rev-parse HEAD)"
          cc --version | head -n 1

      - name: Verify native AVX2, AES-NI and PCLMUL CPU support
        shell: bash
        run: |
          set -euo pipefail
          flags="$(grep -m1 '^flags[[:space:]]*:' /proc/cpuinfo)"
          for feature in avx2 aes pclmulqdq ssse3 sse4_1; do
            if ! grep -qw "$feature" <<< "$flags"; then
              printf 'FAIL: GitHub runner does not expose required CPU feature: %s\n' "$feature" >&2
              exit 1
            fi
          done
          evidence="$RUNNER_TEMP/qsc-acvp-avx2-aesni-evidence"
          mkdir -p "$evidence"
          {
            printf 'CPU model: '
            grep -m1 '^model name' /proc/cpuinfo || true
            printf 'Required verified kernel CPU feature flags: avx2 aes pclmulqdq ssse3 sse4_1\n'
            printf '%s\n' "$flags"
          } > "$evidence/cpu-features.txt"
          echo 'PASS: runner supports AVX2, AES-NI, PCLMULQDQ, SSSE3 and SSE4.1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned independent qualification oracle
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4

      - name: Configure avx2-aesni implementation and verify feature macros
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S Source/ACVP -B "$RUNNER_TEMP/qsc-acvp-avx2-aesni-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQSC_ACVP_TLS_CLASS=3 \
            -DQSC_ACVP_ISA_PROFILE=avx2-aesni
          grep -q '^QSC_ACVP_PROFILE_MACROS_VERIFIED:INTERNAL=1$' \
            "$RUNNER_TEMP/qsc-acvp-avx2-aesni-build/CMakeCache.txt"

      - name: Record source and compiler configuration
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qsc-acvp-avx2-aesni-evidence"
          mkdir -p "$evidence"
          {
            printf 'QSC source commit: %s\n' "$QSC_DEPENDENCY_SHA"
            printf 'Qualification source commit: %s\n' "$GITHUB_SHA"
            printf 'OS: %s\n' "$(uname -s)"
            printf 'Architecture: %s\n' "$(uname -m)"
            printf 'ISA profile: avx2-aesni\nSecurity class: 3\n'
            cc --version | head -n 1
            grep -E '^(QSC_ACVP_ISA_PROFILE|QSC_ACVP_TLS_CLASS|QSC_ACVP_PROFILE_MACROS_VERIFIED):' \
              "$RUNNER_TEMP/qsc-acvp-avx2-aesni-build/CMakeCache.txt"
          } > "$evidence/build-configuration.txt"

      - name: Build SHA and AES native adapters
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/qsc-acvp-avx2-aesni-build" \
            --target qsc_acvp_hash qsc_acvp_aes --parallel 2

      - name: Verify compiled AES-NI, PCLMUL and AVX2 instruction evidence
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/qsc-acvp-avx2-aesni-build"
          evidence="$RUNNER_TEMP/qsc-acvp-avx2-aesni-evidence"
          objdump -d "$build/libqsc_acvp_aes.so" > "$RUNNER_TEMP/qsc-acvp-aes-disassembly.txt"
          objdump -d "$build/libqsc_acvp_hash.so" > "$RUNNER_TEMP/qsc-acvp-hash-disassembly.txt"
          if ! grep -Eq '[[:space:]]aesenc[[:space:]]' "$RUNNER_TEMP/qsc-acvp-aes-disassembly.txt"; then
            echo 'FAIL: compiled AES library lacks AES-NI aesenc instruction' >&2
            exit 1
          fi
          if ! grep -Eq '[[:space:]]pclmulqdq[[:space:]]' "$RUNNER_TEMP/qsc-acvp-aes-disassembly.txt"; then
            echo 'FAIL: compiled AES library lacks PCLMULQDQ instruction' >&2
            exit 1
          fi
          if ! grep -Eq '[[:space:]]vpxor[[:space:]].*%ymm' "$RUNNER_TEMP/qsc-acvp-hash-disassembly.txt"; then
            echo 'FAIL: compiled SHA3 library lacks 256-bit AVX2 vector XOR' >&2
            exit 1
          fi
          {
            echo 'AES-NI aesenc instruction: PRESENT in libqsc_acvp_aes.so'
            echo 'PCLMULQDQ instruction: PRESENT in libqsc_acvp_aes.so'
            echo 'AVX2 256-bit vpxor instruction: PRESENT in libqsc_acvp_hash.so'
            echo 'Note: static disassembly demonstrates compiled instructions, not dynamic path execution.'
          } > "$evidence/isa-evidence.txt"
          echo 'PASS: accelerated instructions are present in native libraries'

      - name: Run ACVP client parser and transport regression tests
        run: python -m unittest discover -s Source/ACVP/tests -p test_demo_client.py -v

      - name: Run consolidated evidence regression tests
        run: python -m unittest discover -s Source/ACVP/tests -p test_consolidation.py -v

      - name: Run SHA and HMAC offline qualification
        run: python Source/ACVP/local_check.py --library "$RUNNER_TEMP/qsc-acvp-avx2-aesni-build/libqsc_acvp_hash.so" --output "$RUNNER_TEMP/qsc-acvp-avx2-aesni-evidence"

      - name: Run SP 800-185 XOF offline qualification
        run: python Source/ACVP/xof_check.py --library "$RUNNER_TEMP/qsc-acvp-avx2-aesni-build/libqsc_acvp_hash.so" --output "$RUNNER_TEMP/qsc-acvp-avx2-aesni-evidence"

      - name: Run PBKDF and HKDF offline qualification
        run: python Source/ACVP/kdf_check.py --library "$RUNNER_TEMP/qsc-acvp-avx2-aesni-build/libqsc_acvp_hash.so" --output "$RUNNER_TEMP/qsc-acvp-avx2-aesni-evidence"

      - name: Run AES interoperability qualification
        run: python Source/ACVP/aes_check.py --library "$RUNNER_TEMP/qsc-acvp-avx2-aesni-build/libqsc_acvp_aes.so" --output "$RUNNER_TEMP/qsc-acvp-avx2-aesni-evidence"

      - name: Generate sanitized evidence manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-avx2-aesni-evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          files = {
              'sha_hmac': ('local-sha-vectors.json', 'LOCAL_SIMULATOR_NOT_NIST'),
              'xof': ('xof-acvp-adapter-results.json', 'PASS_LOCAL_ADAPTER_ONLY'),
              'kdf': ('kdf-acvp-adapter-results.json', 'PASS_LOCAL_ADAPTER_ONLY'),
              'aes': ('aes-results.json', 'PASS_LOCAL_INTEROPERABILITY'),
          }
          results = {}
          for name, (filename, expected) in files.items():
              try:
                  data = json.loads((evidence / filename).read_text(encoding='utf-8'))
                  status = data.get('status', 'MISSING')
                  passed = status == expected
                  if name == 'sha_hmac':
                      cases = data.get('results', [])
                      passed = passed and len(cases) == 10 and all(case.get('passed') for case in cases)
              except (OSError, ValueError, AttributeError, TypeError):
                  status, passed = 'NOT_RUN_OR_UNREADABLE', False
              results[name] = {'status': status, 'pass': bool(passed)}
          isa_evidence = (evidence / 'isa-evidence.txt').is_file()
          cpu_evidence = (evidence / 'cpu-features.txt').is_file()
          success = all(item['pass'] for item in results.values()) and isa_evidence and cpu_evidence
          record = {
              'type': 'QSC_OFFLINE_AVX2_AESNI_BOOTSTRAP_NOT_ACVTS',
              'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'qsc_git_sha': os.environ.get('QSC_DEPENDENCY_SHA', 'NOT_RECORDED'),
              'qualification_git_sha': os.environ.get('GITHUB_SHA', 'NOT_RECORDED'),
              'runner': 'ubuntu-24.04',
              'architecture': 'x86_64',
              'isa_profile': 'avx2-aesni',
              'tls_class': '3',
              'nist_demo': 'NOT_RUN',
              'complete_library_qualification': False,
              'cpu_feature_check': 'PASS' if cpu_evidence else 'MISSING',
              'compiled_isa_evidence': 'PRESENT' if isa_evidence else 'MISSING',
              'status': 'OFFLINE_SMOKE_PASS' if success else 'FAIL_OR_INCOMPLETE',
              'results': results,
          }
          (evidence / 'run-manifest.json').write_text(
              json.dumps(record, indent=2) + '\n', encoding='utf-8')
          print('Offline avx2-aesni bootstrap:', record['status'])
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsc-acvp-linux-x64-avx2-aesni-offline
          path: ${{ runner.temp }}/qsc-acvp-avx2-aesni-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce complete offline bootstrap evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-avx2-aesni-evidence/run-manifest.json'
          if not path.is_file() or json.loads(path.read_text(encoding='utf-8')).get('status') != 'OFFLINE_SMOKE_PASS':
              raise SystemExit('FAIL: offline avx2-aesni bootstrap evidence missing or incomplete')
          print('PASS: avx2-aesni bootstrap complete (offline only, not NIST validation)')
          PY
