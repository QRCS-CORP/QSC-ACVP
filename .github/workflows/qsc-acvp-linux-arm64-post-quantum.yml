      - name: Generate sanitized fail-closed ARM64 post-quantum evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-pq-arm64-crypto-evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          expected = {
              'mldsa-parser-keygen': 'mldsa-parser-keygen.status',
              'mldsa-parser-randomization': 'mldsa-parser-randomization.status',
              'mldsa-parser-mu': 'mldsa-parser-mu.status',
              'mldsa44-native': 'mldsa44-native.status',
              'mldsa65-native': 'mldsa65-native.status',
              'mldsa87-native': 'mldsa87-native.status',
              'slhdsa-parser-keygen': 'slhdsa-parser-keygen.status',
              'slhdsa-parser-nondeterministic': 'slhdsa-parser-nondeterministic.status',
              'slhdsa-parser-prehash': 'slhdsa-parser-prehash.status',
              'slhdsa128s-native': 'slhdsa128s-native.status',
              'slhdsa128f-native': 'slhdsa128f-native.status',
              'slhdsa192s-native': 'slhdsa192s-native.status',
              'slhdsa192f-native': 'slhdsa192f-native.status',
              'slhdsa256s-native': 'slhdsa256s-native.status',
              'slhdsa256f-native': 'slhdsa256f-native.status',
          }
          results = {}
          for name, filename in expected.items():
              try:
                  results[name] = (evidence / filename).read_text(
                      encoding='utf-8').strip() == 'PASS'
              except OSError:
                  results[name] = False
          mlkem_ok = False
          mlkem_native = 0
          mlkem_status = 'NOT_RUN_OR_UNREADABLE'
          try:
              data = json.loads((evidence / 'mlkem-results.json').read_text(encoding='utf-8'))
              mlkem_native = data.get('native_tests', 0)
              mlkem_status = data.get('status', 'MISSING')
              mlkem_ok = (mlkem_status == 'PASS_LOCAL_ADAPTER_ONLY'
                          and mlkem_native == 3
                          and data.get('parameter_sets') == [
                              'ML-KEM-512', 'ML-KEM-768', 'ML-KEM-1024'])
          except (OSError, ValueError, AttributeError, TypeError):
              pass
          try:
              mlkem_parser_ok = ((evidence / 'mlkem-parser.status').read_text(
                  encoding='utf-8').strip() == 'PASS')
          except OSError:
              mlkem_parser_ok = False
          config_ok = (evidence / 'build-configuration.txt').is_file()
          cpu_ok = (evidence / 'cpu-features.txt').is_file()
          isa_ok = (evidence / 'isa-evidence.txt').is_file()
          complete = (all(results.values()) and mlkem_ok and mlkem_parser_ok
                      and config_ok and cpu_ok and isa_ok)
          report = {
              'type': 'QSC_LINUX_ARM64_POST_QUANTUM_FIPS203_204_205_OFFLINE_NOT_ACVTS',
              'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'qsc_git_sha': os.environ.get('QSC_DEPENDENCY_SHA', 'NOT_RECORDED'),
              'qualification_git_sha': os.environ.get('GITHUB_SHA', 'NOT_RECORDED'),
              'runner': 'ubuntu-24.04-arm',
              'architecture': 'aarch64',
              'isa_profile': 'arm64-crypto',
              'mlkem_native_count': mlkem_native,
              'mlkem_native_status': mlkem_status,
              'mlkem_parser_regressions': 'PASS' if mlkem_parser_ok else 'MISSING',
              'mldsa_native_passed': sum(results[x] for x in (
                  'mldsa44-native', 'mldsa65-native', 'mldsa87-native')),
              'slhdsa_native_passed': sum(results[x] for x in (
                  'slhdsa128s-native', 'slhdsa128f-native', 'slhdsa192s-native',
                  'slhdsa192f-native', 'slhdsa256s-native', 'slhdsa256f-native')),
              'signature_parser_regressions_passed': sum(
                  results[x] for x in expected if '-parser-' in x),
              'test_results': results,
              'cpu_feature_check': 'PASS' if cpu_ok else 'MISSING',
              'compiled_isa_evidence': 'PRESENT' if isa_ok else 'MISSING',
              'build_configuration': 'PRESENT' if config_ok else 'MISSING',
              'nist_demo': 'NOT_RUN',
              'external_acvts_verdict': 'NOT_RUN',
              'complete_library_qualification': False,
              'status': 'OFFLINE_ARM64_PQ_PASS' if complete else 'FAIL_OR_INCOMPLETE',
          }
          (evidence / 'run-manifest.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print('ARM64 post-quantum offline evidence:', report['status'])
          PY

      - name: Upload sanitized ARM64 PQ evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsc-acvp-linux-arm64-post-quantum-offline
          path: ${{ runner.temp }}/qsc-acvp-pq-arm64-crypto-evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Enforce complete ARM64 post-quantum evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-pq-arm64-crypto-evidence/run-manifest.json'
          if not manifest.is_file() or json.loads(manifest.read_text(encoding='utf-8')).get('status') != 'OFFLINE_ARM64_PQ_PASS':
              raise SystemExit('FAIL: ARM64 ML-KEM/ML-DSA/SLH-DSA evidence missing or incomplete')
          print('PASS: independent ARM64 post-quantum offline qualification; NOT NIST validation')
          PY
