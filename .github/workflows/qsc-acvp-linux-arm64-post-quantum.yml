# Separate manual Linux ARM64 FIPS 203/204/205 offline checks; not NIST validation.
name: QSC ACVP Linux ARM64 post-quantum offline qualification

on:
  workflow_dispatch:
    inputs:
      qsc_ref:
        description: 'Immutable 40-character QSC source commit to qualify'
        required: true
        type: string
        default: 43c8aa2afe9d38c3ddf9bac0107196545981ac28

permissions:
  contents: read

concurrency:
  group: qsc-acvp-sequential-qualification
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  linux-arm64-post-quantum:
    name: Linux ARM64 NEON ML-KEM, ML-DSA and SLH-DSA offline qualification
    if: github.repository == 'QRCS-CORP/QSC-ACVP'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40

    steps:
      - name: Checkout reviewed qualification revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pinned QSC dependency read-only
        uses: actions/checkout@v4
        with:
          repository: QRCS-CORP/QSC
          ref: ${{ inputs.qsc_ref }}
          path: dependency/QSC
          persist-credentials: false

      - name: Verify pinned source and native ARM64 crypto CPU
        shell: bash
        env:
          QSC_REQUESTED_SHA: ${{ inputs.qsc_ref }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          if [[ ! "$QSC_REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'FAIL: source must be pinned to an immutable 40-character SHA' >&2
            exit 1
          fi
          sha="$(git -C dependency/QSC rev-parse HEAD)"
          if [[ "$sha" != "$QSC_REQUESTED_SHA" ]]; then
            echo 'FAIL: QSC checkout differs from the immutable requested revision' >&2
            exit 1
          fi
          printf 'QSC_DEPENDENCY_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          echo "QSC source commit: $sha"
          echo "Qualification commit: $(git rev-parse HEAD)"
          features="$(grep -m1 -E '^(Features|flags)[[:space:]]*:' /proc/cpuinfo)"
          test -n "$features"
          for feature in asimd aes pmull sha2; do
            if ! grep -qw "$feature" <<< "$features"; then
              echo "FAIL: required Linux ARM64 CPU feature is absent: $feature" >&2
              exit 1
            fi
          done
          evidence="$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-evidence"
          mkdir -p "$evidence"
          {
            echo 'Required ARM64 CPU features: asimd aes pmull sha2'
            uname -a
            printf '%s\n' "$features"
          } > "$evidence/cpu-features.txt"
          echo 'PASS: immutable QSC source and native ARM64 crypto CPU verified'

      - name: Configure isolated ARM64 crypto post-quantum build
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S Source/ACVP -B "$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQSC_ACVP_TLS_CLASS=3 \
            -DQSC_ACVP_ISA_PROFILE=arm64-crypto
          grep -q '^QSC_ACVP_PROFILE_MACROS_VERIFIED:INTERNAL=1$' \
            "$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-build/CMakeCache.txt"
          evidence="$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-evidence"
          {
            echo "QSC source SHA: $QSC_DEPENDENCY_SHA"
            echo "Qualification SHA: $GITHUB_SHA"
            echo 'ISA profile: arm64-crypto'
            cc --version | head -n 1
            grep -E '^(QSC_ACVP_ISA_PROFILE|QSC_ACVP_TLS_CLASS|QSC_ACVP_PROFILE_MACROS_VERIFIED):' \
              "$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-build/CMakeCache.txt"
          } > "$evidence/build-configuration.txt"

      - name: Compile pinned native ML-KEM, ML-DSA and SLH-DSA adapters
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-build" \
            --target qsc_acvp_pq --parallel 2
          test -s "$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-build/libqsc_acvp_pq.so"

      - name: Verify native ARM64 post-quantum symbols and NEON machine code
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-evidence"
          library="$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-build/libqsc_acvp_pq.so"
          nm -D --defined-only "$library" > "$RUNNER_TEMP/qsc-arm64-pq-symbols.txt"
          for parameter in 512 768 1024; do
            if ! grep -Eq "[[:space:]]qsc_kyber${parameter}_generate_seeded_keypair$" \
              "$RUNNER_TEMP/qsc-arm64-pq-symbols.txt"; then
              echo "FAIL: ML-KEM-$parameter public seeded-keygen symbol missing" >&2
              exit 1
            fi
          done
          for parameter in 44 65 87; do
            if ! grep -Eq "[[:space:]]qsc_mldsa${parameter}_sign_ex$" \
              "$RUNNER_TEMP/qsc-arm64-pq-symbols.txt"; then
              echo "FAIL: ML-DSA-$parameter signing symbol missing" >&2
              exit 1
            fi
          done
          for parameter in 128s 128f 192s 192f 256s 256f; do
            if ! grep -Eq "[[:space:]]qsc_slhdsa_shake${parameter}_sign_deterministic$" \
              "$RUNNER_TEMP/qsc-arm64-pq-symbols.txt"; then
              echo "FAIL: SLH-DSA-SHAKE-$parameter signing symbol missing" >&2
              exit 1
            fi
          done
          objdump -d "$library" > "$RUNNER_TEMP/qsc-arm64-pq-disassembly.txt"
          if ! grep -Eq '[[:space:]]smull[[:space:]]+v[0-9]+' "$RUNNER_TEMP/qsc-arm64-pq-disassembly.txt"; then
            echo 'FAIL: PQ library lacks NEON polynomial signed multiply-long instruction' >&2
            exit 1
          fi
          if ! grep -Eq '[[:space:]]eor[[:space:]]+v[0-9]+' "$RUNNER_TEMP/qsc-arm64-pq-disassembly.txt"; then
            echo 'FAIL: PQ library lacks NEON vector XOR' >&2
            exit 1
          fi
          {
            echo 'ML-KEM three public parameter-set symbols: PRESENT'
            echo 'ML-DSA three public parameter-set symbols: PRESENT'
            echo 'SLH-DSA SHAKE six public parameter-set symbols: PRESENT'
            echo 'ARM64 NEON vector SMULL and EOR instructions: PRESENT'
            echo 'Compiled instruction presence does not prove complete dynamic branch coverage.'
          } > "$evidence/isa-evidence.txt"
          echo 'PASS: ARM64 PQ public interfaces and compiled NEON machine code'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run twelve ML-KEM parser and fail-closed regressions
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-evidence"
          python -m unittest discover -s Source/ACVP/tests -p test_mlkem_vectors.py -v \
            2>&1 | tee "$evidence/mlkem-parser.log"
          grep -Eq '^Ran 12 tests in' "$evidence/mlkem-parser.log"
          grep -Eq '^OK$' "$evidence/mlkem-parser.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/mlkem-parser.log"; then
            echo 'FAIL: ML-KEM parser regressions were skipped or failed' >&2
            exit 1
          fi
          echo PASS > "$evidence/mlkem-parser.status"
          echo 'PASS: twelve ML-KEM vector/parser regressions'

      - name: Run all three native ML-KEM FIPS 203 parameter-set checks
        shell: bash
        run: |
          set -euo pipefail
          python Source/ACVP/mlkem_check.py \
            --library "$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-build/libqsc_acvp_pq.so" \
            --output "$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-evidence"
          echo 'ML-KEM native adapter returned; final manifest enforces three parameter-set results'

      - name: Run ML-DSA seeded key generation parser
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          evidence="$RUNNER_TEMP/qsc-acvp-pq-arm64-crypto-evidence"
          python -m unittest -v test_pq_vector_modes.PqVectorModeTests.test_ml_dsa_seeded_keygen_vector \
            2>&1 | tee "$evidence/mldsa-parser-keygen.log"
          grep -Eq '^Ran 1 test in' "$evidence/mldsa-parser-keygen.log"
          grep -Eq '^OK$' "$evidence/mldsa-parser-keygen.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/mldsa-parser-keygen.log"; then
            echo 'FAIL: ML-DSA seeded key generation parser' >&2
            exit 1
          fi
          echo PASS > "$evidence/mldsa-parser-keygen.status"
          echo 'PASS: ML-DSA seeded key generation parser'

