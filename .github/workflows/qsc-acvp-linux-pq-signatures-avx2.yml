      - name: Generate sanitized signature-family evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-pq-signatures-avx2-evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          expected = {
              'mldsa-parser-keygen': 'mldsa-parser-keygen.status',
              'mldsa-parser-randomization': 'mldsa-parser-randomization.status',
              'mldsa-parser-mu': 'mldsa-parser-mu.status',
              'mldsa44-native': 'mldsa44-native.status',
              'mldsa65-native': 'mldsa65-native.status',
              'mldsa87-native': 'mldsa87-native.status',
              'slhdsa-parser-keygen': 'slhdsa-parser-keygen.status',
              'slhdsa-parser-nondeterministic': 'slhdsa-parser-nondeterministic.status',
              'slhdsa-parser-prehash': 'slhdsa-parser-prehash.status',
              'slhdsa128s-native': 'slhdsa128s-native.status',
              'slhdsa128f-native': 'slhdsa128f-native.status',
              'slhdsa192s-native': 'slhdsa192s-native.status',
              'slhdsa192f-native': 'slhdsa192f-native.status',
              'slhdsa256s-native': 'slhdsa256s-native.status',
              'slhdsa256f-native': 'slhdsa256f-native.status',
          }
          results = {}
          for name, file_name in expected.items():
              try:
                  results[name] = (evidence / file_name).read_text(
                      encoding='utf-8').strip() == 'PASS'
              except OSError:
                  results[name] = False
          config_ok = (evidence / 'build-configuration.txt').is_file()
          cpu_ok = (evidence / 'cpu-features.txt').is_file()
          isa_ok = (evidence / 'isa-evidence.txt').is_file()
          complete = all(results.values()) and config_ok and cpu_ok and isa_ok
          record = {
              'type': 'QSC_LINUX_AVX2_MLDSA_SLHDSA_OFFLINE_NOT_ACVTS',
              'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'qsc_git_sha': os.environ.get('QSC_DEPENDENCY_SHA', 'NOT_RECORDED'),
              'qualification_git_sha': os.environ.get('GITHUB_SHA', 'NOT_RECORDED'),
              'runner': 'ubuntu-24.04',
              'architecture': 'x86_64',
              'isa_profile': 'avx2-aesni',
              'mldsa_native_passed': sum(results[name] for name in (
                  'mldsa44-native', 'mldsa65-native', 'mldsa87-native')),
              'slhdsa_native_passed': sum(results[name] for name in (
                  'slhdsa128s-native', 'slhdsa128f-native', 'slhdsa192s-native',
                  'slhdsa192f-native', 'slhdsa256s-native', 'slhdsa256f-native')),
              'parser_regressions_passed': sum(results[name] for name in expected
                                               if '-parser-' in name),
              'test_results': results,
              'cpu_features': 'PASS' if cpu_ok else 'MISSING',
              'compiled_isa_evidence': 'PRESENT' if isa_ok else 'MISSING',
              'build_configuration': 'PRESENT' if config_ok else 'MISSING',
              'nist_demo': 'NOT_RUN',
              'external_acvts_verdict': 'NOT_RUN',
              'complete_library_qualification': False,
              'status': 'OFFLINE_AVX2_SIGNATURES_PASS' if complete else 'FAIL_OR_INCOMPLETE',
          }
          (evidence / 'run-manifest.json').write_text(
              json.dumps(record, indent=2) + '\n', encoding='utf-8')
          print('AVX2 signature family evidence:', record['status'])
          PY

      - name: Upload sanitized ML-DSA/SLH-DSA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsc-acvp-linux-x64-avx2-mldsa-slhdsa-offline
          path: ${{ runner.temp }}/qsc-acvp-pq-signatures-avx2-evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Enforce complete independent signature evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          file = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-pq-signatures-avx2-evidence/run-manifest.json'
          if not file.is_file() or json.loads(file.read_text(encoding='utf-8')).get('status') != 'OFFLINE_AVX2_SIGNATURES_PASS':
              raise SystemExit('FAIL: AVX2 ML-DSA/SLH-DSA evidence missing or incomplete')
          print('PASS: independent AVX2 signature-family offline tests; NOT NIST validation')
          PY
