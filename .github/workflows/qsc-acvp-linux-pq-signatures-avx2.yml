# Independent AVX2 ML-DSA/SLH-DSA offline qualification; not NIST ACVTS.
name: QSC ACVP Linux x64 AVX2 ML-DSA and SLH-DSA offline qualification

on:
  workflow_dispatch:
    inputs:
      qsc_ref:
        description: 'Immutable 40-character QSC source commit to qualify'
        required: true
        type: string
        default: 43c8aa2afe9d38c3ddf9bac0107196545981ac28

permissions:
  contents: read

concurrency:
  group: qsc-acvp-sequential-qualification
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  linux-pq-avx2-signatures:
    name: Linux AVX2 ML-DSA FIPS 204 and SLH-DSA FIPS 205 offline checks
    if: github.repository == 'QRCS-CORP/QSC-ACVP'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout qualification revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pinned QSC dependency read-only
        uses: actions/checkout@v4
        with:
          repository: QRCS-CORP/QSC
          ref: ${{ inputs.qsc_ref }}
          path: dependency/QSC
          persist-credentials: false

      - name: Verify pinned QSC source and AVX2/BMI2 CPU
        shell: bash
        env:
          QSC_REQUESTED_SHA: ${{ inputs.qsc_ref }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          if [[ ! "$QSC_REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'FAIL: expected immutable 40-character QSC commit SHA' >&2
            exit 1
          fi
          sha="$(git -C dependency/QSC rev-parse HEAD)"
          if [[ "$sha" != "$QSC_REQUESTED_SHA" ]]; then
            echo 'FAIL: QSC dependency SHA differs from requested pinned source' >&2
            exit 1
          fi
          echo "QSC_DEPENDENCY_SHA=$sha" >> "$GITHUB_ENV"
          echo "QSC source commit: $sha"
          echo "Qualification commit: $(git rev-parse HEAD)"
          flags="$(grep -m1 '^flags[[:space:]]*:' /proc/cpuinfo)"
          for feature in avx2 aes pclmulqdq bmi2 ssse3 sse4_1; do
            if ! grep -qw "$feature" <<< "$flags"; then
              echo "FAIL: required AVX2 qualification CPU feature absent: $feature" >&2
              exit 1
            fi
          done
          evidence="$RUNNER_TEMP/qsc-acvp-pq-signatures-avx2-evidence"
          mkdir -p "$evidence"
          {
            echo 'Required CPU features: avx2 aes pclmulqdq bmi2 ssse3 sse4_1'
            grep -m1 '^model name' /proc/cpuinfo || true
            printf '%s\n' "$flags"
          } > "$evidence/cpu-features.txt"
          echo 'PASS: pinned dependency and AVX2/BMI2 CPU prerequisites'

      - name: Configure isolated accelerated qualification build
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S Source/ACVP -B "$RUNNER_TEMP/qsc-acvp-pq-signatures-avx2-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQSC_ACVP_TLS_CLASS=3 \
            -DQSC_ACVP_ISA_PROFILE=avx2-aesni
          grep -q '^QSC_ACVP_PROFILE_MACROS_VERIFIED:INTERNAL=1$' \
            "$RUNNER_TEMP/qsc-acvp-pq-signatures-avx2-build/CMakeCache.txt"
          evidence="$RUNNER_TEMP/qsc-acvp-pq-signatures-avx2-evidence"
          {
            echo "QSC dependency SHA: $QSC_DEPENDENCY_SHA"
            echo "Qualification SHA: $GITHUB_SHA"
            echo 'ISA profile: avx2-aesni (BMI2 enabled on PQ library)'
            cc --version | head -n 1
            grep -E '^(QSC_ACVP_ISA_PROFILE|QSC_ACVP_TLS_CLASS|QSC_ACVP_PROFILE_MACROS_VERIFIED):' \
              "$RUNNER_TEMP/qsc-acvp-pq-signatures-avx2-build/CMakeCache.txt"
          } > "$evidence/build-configuration.txt"

      - name: Build native QSC ML-DSA and SLH-DSA library
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/qsc-acvp-pq-signatures-avx2-build" \
            --target qsc_acvp_pq --parallel 2
          test -s "$RUNNER_TEMP/qsc-acvp-pq-signatures-avx2-build/libqsc_acvp_pq.so"

      - name: Verify compiled ML-DSA AVX2 backends and SLH-DSA signatures
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qsc-acvp-pq-signatures-avx2-evidence"
          library="$RUNNER_TEMP/qsc-acvp-pq-signatures-avx2-build/libqsc_acvp_pq.so"
          nm -D --defined-only "$library" > "$RUNNER_TEMP/pq-signatures-symbols.txt"
          for size in 44 65 87; do
            if ! grep -Eq "[[:space:]]qsc_mldsa${size}_ref_avx2_sign$" "$RUNNER_TEMP/pq-signatures-symbols.txt"; then
              echo "FAIL: ML-DSA-$size AVX2 signature backend symbol missing" >&2
              exit 1
            fi
          done
          for parameter in 128s 128f 192s 192f 256s 256f; do
            if ! grep -Eq "[[:space:]]qsc_slhdsa_shake${parameter}_sign_deterministic$" "$RUNNER_TEMP/pq-signatures-symbols.txt"; then
              echo "FAIL: SLH-DSA-SHAKE-$parameter signature API missing" >&2
              exit 1
            fi
          done
          objdump -d "$library" > "$RUNNER_TEMP/pq-signatures-disassembly.txt"
          if ! grep -Eq '[[:space:]]vpxor[[:space:]].*%ymm' "$RUNNER_TEMP/pq-signatures-disassembly.txt"; then
            echo 'FAIL: 256-bit AVX2 vector XOR absent in native PQ library' >&2
            exit 1
          fi
          {
            echo 'ML-DSA-44/65/87 native AVX2 signing backend symbols: PRESENT'
            echo 'SLH-DSA-SHAKE-128s/f,192s/f,256s/f deterministic signing symbols: PRESENT'
            echo 'AVX2 256-bit vpxor instruction in PQ shared library: PRESENT'
            echo 'These are compiled-code checks, not complete dynamic ISA tracing.'
          } > "$evidence/isa-evidence.txt"
          echo 'PASS: compiled ML-DSA AVX2 backend, SLH-DSA signature symbols and AVX2 ISA'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test ML-DSA key generation parser
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          evidence="$RUNNER_TEMP/qsc-acvp-pq-signatures-avx2-evidence"
          python -m unittest -v test_pq_vector_modes.PqVectorModeTests.test_ml_dsa_seeded_keygen_vector \
            2>&1 | tee "$evidence/mldsa-parser-keygen.log"
          grep -Eq '^Ran 1 test in' "$evidence/mldsa-parser-keygen.log"
          grep -Eq '^OK$' "$evidence/mldsa-parser-keygen.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/mldsa-parser-keygen.log"; then
            echo 'FAIL: ML-DSA key generation parser' >&2
            exit 1
          fi
          echo PASS > "$evidence/mldsa-parser-keygen.status"
          echo 'PASS: ML-DSA key generation parser'

      - name: Test ML-DSA randomized signing rejection
