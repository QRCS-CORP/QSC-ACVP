# Independent FIPS 204 ML-DSA adapter smoke coverage; manual only, not NIST validation.
name: QSC ACVP Linux x64 scalar ML-DSA offline qualification

on:
  workflow_dispatch:
    inputs:
      qsc_ref:
        description: 'Immutable 40-character QSC source commit to qualify'
        type: string
        required: true
        default: 43c8aa2afe9d38c3ddf9bac0107196545981ac28

permissions:
  contents: read

concurrency:
  group: qsc-acvp-sequential-qualification
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  linux-mldsa-scalar:
    name: Linux x64 scalar FIPS 204 ML-DSA adapter checks
    if: github.repository == 'QRCS-CORP/QSC-ACVP'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout reviewed qualification revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pinned QSC dependency read-only
        uses: actions/checkout@v4
        with:
          repository: QRCS-CORP/QSC
          ref: ${{ inputs.qsc_ref }}
          path: dependency/QSC
          persist-credentials: false

      - name: Verify pinned QSC revision and Linux x64 target
        shell: bash
        env:
          QSC_REQUESTED_SHA: ${{ inputs.qsc_ref }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          if [[ ! "$QSC_REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'FAIL: an immutable 40-character lowercase QSC revision is mandatory' >&2
            exit 1
          fi
          sha="$(git -C dependency/QSC rev-parse HEAD)"
          if [[ "$sha" != "$QSC_REQUESTED_SHA" ]]; then
            echo 'FAIL: QSC checkout differs from requested immutable revision' >&2
            exit 1
          fi
          printf 'QSC_DEPENDENCY_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          echo "QSC source commit: $sha"
          echo "Qualification commit: $(git rev-parse HEAD)"

      - name: Configure isolated Linux scalar compilation profile
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S Source/ACVP -B "$RUNNER_TEMP/qsc-acvp-mldsa-scalar-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQSC_ACVP_TLS_CLASS=3 \
            -DQSC_ACVP_ISA_PROFILE=scalar
          grep -q '^QSC_ACVP_PROFILE_MACROS_VERIFIED:INTERNAL=1$' \
            "$RUNNER_TEMP/qsc-acvp-mldsa-scalar-build/CMakeCache.txt"

      - name: Record source and compilation configuration
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qsc-acvp-mldsa-scalar-evidence"
          mkdir -p "$evidence"
          {
            printf 'QSC source commit: %s\n' "$QSC_DEPENDENCY_SHA"
            printf 'Qualification commit: %s\n' "$GITHUB_SHA"
            printf 'Operating system: %s\n' "$(uname -s)"
            printf 'Architecture: %s\n' "$(uname -m)"
            printf 'Test family: ML-DSA FIPS 204 three parameter sets\n'
            printf 'ISA profile: scalar\nTLS class: 3\n'
            cc --version | head -n 1
            grep -E '^(QSC_ACVP_ISA_PROFILE|QSC_ACVP_TLS_CLASS|QSC_ACVP_PROFILE_MACROS_VERIFIED):' \
              "$RUNNER_TEMP/qsc-acvp-mldsa-scalar-build/CMakeCache.txt"
          } > "$evidence/build-configuration.txt"

      - name: Build pinned QSC native post-quantum library
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/qsc-acvp-mldsa-scalar-build" \
            --target qsc_acvp_pq --parallel 2
          test -s "$RUNNER_TEMP/qsc-acvp-mldsa-scalar-build/libqsc_acvp_pq.so"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ML-DSA seeded-keyGen parser regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          evidence="$RUNNER_TEMP/qsc-acvp-mldsa-scalar-evidence"
          python -m unittest -v test_pq_vector_modes.PqVectorModeTests.test_ml_dsa_seeded_keygen_vector \
            2>&1 | tee "$evidence/mldsa-parser-keygen.log"
          grep -Eq '^Ran 1 test in' "$evidence/mldsa-parser-keygen.log"
          grep -Eq '^OK$' "$evidence/mldsa-parser-keygen.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/mldsa-parser-keygen.log"; then
            echo 'FAIL: ML-DSA keyGen parser regression' >&2
            exit 1
          fi
          echo PASS > "$evidence/mldsa-parser-keygen.status"
          echo 'PASS: ML-DSA seeded-keyGen parser regression'

      - name: Run ML-DSA randomized-signing rejection regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          evidence="$RUNNER_TEMP/qsc-acvp-mldsa-scalar-evidence"
          python -m unittest -v test_pq_vector_modes.PqVectorModeTests.test_ml_dsa_rejects_randomized_siggen \
            2>&1 | tee "$evidence/mldsa-parser-randomization.log"
          grep -Eq '^Ran 1 test in' "$evidence/mldsa-parser-randomization.log"
          grep -Eq '^OK$' "$evidence/mldsa-parser-randomization.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/mldsa-parser-randomization.log"; then
            echo 'FAIL: ML-DSA randomized-signing rejection regression' >&2
            exit 1
          fi
          echo PASS > "$evidence/mldsa-parser-randomization.status"
          echo 'PASS: ML-DSA randomized-signing rejection regression'

      - name: Run ML-DSA internal-mu rejection regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          evidence="$RUNNER_TEMP/qsc-acvp-mldsa-scalar-evidence"
          python -m unittest -v test_pq_vector_modes.PqVectorModeTests.test_ml_dsa_rejects_internal_mu_siggen \
            2>&1 | tee "$evidence/mldsa-parser-mu.log"
          grep -Eq '^Ran 1 test in' "$evidence/mldsa-parser-mu.log"
          grep -Eq '^OK$' "$evidence/mldsa-parser-mu.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/mldsa-parser-mu.log"; then
            echo 'FAIL: ML-DSA internal-mu rejection regression' >&2
            exit 1
          fi
          echo PASS > "$evidence/mldsa-parser-mu.status"
          echo 'PASS: ML-DSA internal-mu rejection regression'

      - name: Run ML-DSA-44 native signing and ACVP vector replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          export QSC_ACVP_PQ_LIBRARY="$RUNNER_TEMP/qsc-acvp-mldsa-scalar-build/libqsc_acvp_pq.so"
          evidence="$RUNNER_TEMP/qsc-acvp-mldsa-scalar-evidence"
          python -m unittest -v test_pq_signature_native.PqSignatureNativeTests.test_mldsa44 \
            2>&1 | tee "$evidence/mldsa44-native.log"
          grep -Eq '^Ran 1 test in' "$evidence/mldsa44-native.log"
          grep -Eq '^OK$' "$evidence/mldsa44-native.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/mldsa44-native.log"; then
            echo 'FAIL: ML-DSA-44 native qualification' >&2
            exit 1
          fi
          echo PASS > "$evidence/mldsa44-native.status"
          echo 'PASS: ML-DSA-44 native signing, rejection and vector replay'

      - name: Run ML-DSA-65 native signing and ACVP vector replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          export QSC_ACVP_PQ_LIBRARY="$RUNNER_TEMP/qsc-acvp-mldsa-scalar-build/libqsc_acvp_pq.so"
          evidence="$RUNNER_TEMP/qsc-acvp-mldsa-scalar-evidence"
          python -m unittest -v test_pq_signature_native.PqSignatureNativeTests.test_mldsa65 \
            2>&1 | tee "$evidence/mldsa65-native.log"
          grep -Eq '^Ran 1 test in' "$evidence/mldsa65-native.log"
          grep -Eq '^OK$' "$evidence/mldsa65-native.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/mldsa65-native.log"; then
            echo 'FAIL: ML-DSA-65 native qualification' >&2
            exit 1
          fi
          echo PASS > "$evidence/mldsa65-native.status"
          echo 'PASS: ML-DSA-65 native signing, rejection and vector replay'

      - name: Run ML-DSA-87 native signing and ACVP vector replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          export QSC_ACVP_PQ_LIBRARY="$RUNNER_TEMP/qsc-acvp-mldsa-scalar-build/libqsc_acvp_pq.so"
          evidence="$RUNNER_TEMP/qsc-acvp-mldsa-scalar-evidence"
          python -m unittest -v test_pq_signature_native.PqSignatureNativeTests.test_mldsa87 \
            2>&1 | tee "$evidence/mldsa87-native.log"
          grep -Eq '^Ran 1 test in' "$evidence/mldsa87-native.log"
          grep -Eq '^OK$' "$evidence/mldsa87-native.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/mldsa87-native.log"; then
            echo 'FAIL: ML-DSA-87 native qualification' >&2
            exit 1
          fi
          echo PASS > "$evidence/mldsa87-native.status"
          echo 'PASS: ML-DSA-87 native signing, rejection and vector replay'

      - name: Generate sanitized fail-closed ML-DSA evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-mldsa-scalar-evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          expected = {
              'ml_dsa_44': 'mldsa44-native.status',
              'ml_dsa_65': 'mldsa65-native.status',
              'ml_dsa_87': 'mldsa87-native.status',
              'keygen_parser': 'mldsa-parser-keygen.status',
              'randomized_signing_rejection': 'mldsa-parser-randomization.status',
              'internal_mu_rejection': 'mldsa-parser-mu.status',
          }
          results = {}
          for name, file_name in expected.items():
              try:
                  results[name] = (evidence / file_name).read_text(
                      encoding='utf-8').strip() == 'PASS'
              except OSError:
                  results[name] = False
          config_ok = (evidence / 'build-configuration.txt').is_file()
          complete = all(results.values()) and config_ok
          record = {
              'type': 'QSC_LINUX_SCALAR_MLDSA_FIPS204_OFFLINE_NOT_ACVTS',
              'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'qsc_git_sha': os.environ.get('QSC_DEPENDENCY_SHA', 'NOT_RECORDED'),
              'qualification_git_sha': os.environ.get('GITHUB_SHA', 'NOT_RECORDED'),
              'runner': 'ubuntu-24.04',
              'architecture': 'x86_64',
              'isa_profile': 'scalar',
              'algorithms': ['ML-DSA-44', 'ML-DSA-65', 'ML-DSA-87'],
              'native_test_count': sum(results[key] for key in ('ml_dsa_44', 'ml_dsa_65', 'ml_dsa_87')),
              'parser_regression_count': sum(results[key] for key in ('keygen_parser', 'randomized_signing_rejection', 'internal_mu_rejection')),
              'test_results': results,
              'build_configuration': 'PRESENT' if config_ok else 'MISSING',
              'nist_demo': 'NOT_RUN',
              'external_acvts_verdict': 'NOT_RUN',
              'complete_library_qualification': False,
              'status': 'OFFLINE_MLDSA_PASS' if complete else 'FAIL_OR_INCOMPLETE',
          }
          (evidence / 'run-manifest.json').write_text(
              json.dumps(record, indent=2) + '\n', encoding='utf-8')
          print('Linux scalar ML-DSA offline checks:', record['status'])
          PY

      - name: Upload sanitized ML-DSA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsc-acvp-linux-x64-scalar-mldsa-offline
          path: ${{ runner.temp }}/qsc-acvp-mldsa-scalar-evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Enforce complete independent ML-DSA evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-mldsa-scalar-evidence/run-manifest.json'
          if not path.is_file() or json.loads(path.read_text(encoding='utf-8')).get('status') != 'OFFLINE_MLDSA_PASS':
              raise SystemExit('FAIL: Linux scalar ML-DSA evidence is incomplete')
          print('PASS: standalone ML-DSA offline tests (not NIST validation)')
          PY
