# Independent FIPS 205 SLH-DSA adapter smoke coverage; manual only, not NIST validation.
name: QSC ACVP Linux x64 scalar SLH-DSA offline qualification

on:
  workflow_dispatch:
    inputs:
      qsc_ref:
        description: 'Immutable 40-character QSC source commit to qualify'
        type: string
        required: true
        default: 43c8aa2afe9d38c3ddf9bac0107196545981ac28

permissions:
  contents: read

concurrency:
  group: qsc-acvp-sequential-qualification
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  linux-slhdsa-scalar:
    name: Linux x64 scalar FIPS 205 SLH-DSA adapter checks
    if: github.repository == 'QRCS-CORP/QSC-ACVP'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout reviewed qualification revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pinned QSC dependency read-only
        uses: actions/checkout@v4
        with:
          repository: QRCS-CORP/QSC
          ref: ${{ inputs.qsc_ref }}
          path: dependency/QSC
          persist-credentials: false

      - name: Verify pinned QSC revision and Linux x64 target
        shell: bash
        env:
          QSC_REQUESTED_SHA: ${{ inputs.qsc_ref }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          if [[ ! "$QSC_REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'FAIL: an immutable 40-character lowercase QSC revision is mandatory' >&2
            exit 1
          fi
          sha="$(git -C dependency/QSC rev-parse HEAD)"
          if [[ "$sha" != "$QSC_REQUESTED_SHA" ]]; then
            echo 'FAIL: QSC checkout differs from requested immutable revision' >&2
            exit 1
          fi
          printf 'QSC_DEPENDENCY_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          echo "QSC source commit: $sha"
          echo "Qualification commit: $(git rev-parse HEAD)"

      - name: Configure isolated Linux scalar compilation profile
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S Source/ACVP -B "$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQSC_ACVP_TLS_CLASS=3 \
            -DQSC_ACVP_ISA_PROFILE=scalar
          grep -q '^QSC_ACVP_PROFILE_MACROS_VERIFIED:INTERNAL=1$' \
            "$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-build/CMakeCache.txt"

      - name: Record source and compilation configuration
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-evidence"
          mkdir -p "$evidence"
          {
            printf 'QSC source commit: %s\n' "$QSC_DEPENDENCY_SHA"
            printf 'Qualification commit: %s\n' "$GITHUB_SHA"
            printf 'Operating system: %s\n' "$(uname -s)"
            printf 'Architecture: %s\n' "$(uname -m)"
            printf 'Test family: SLH-DSA SHAKE FIPS 205 six parameter sets\n'
            printf 'ISA profile: scalar\nTLS class: 3\n'
            cc --version | head -n 1
            grep -E '^(QSC_ACVP_ISA_PROFILE|QSC_ACVP_TLS_CLASS|QSC_ACVP_PROFILE_MACROS_VERIFIED):' \
              "$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-build/CMakeCache.txt"
          } > "$evidence/build-configuration.txt"

      - name: Build pinned QSC native post-quantum library
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-build" \
            --target qsc_acvp_pq --parallel 2
          test -s "$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-build/libqsc_acvp_pq.so"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run SLH-DSA Seeded keyGen parsing regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          evidence="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-evidence"
          python -m unittest -v test_pq_vector_modes.PqVectorModeTests.test_slhdsa_seeded_keygen_vector \
            2>&1 | tee "$evidence/slhdsa-parser-keygen.log"
          grep -Eq '^Ran 1 test in' "$evidence/slhdsa-parser-keygen.log"
          grep -Eq '^OK$' "$evidence/slhdsa-parser-keygen.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/slhdsa-parser-keygen.log"; then
            echo 'FAIL: SLH-DSA Seeded keyGen parsing regression' >&2
            exit 1
          fi
          echo PASS > "$evidence/slhdsa-parser-keygen.status"
          echo 'PASS: SLH-DSA Seeded keyGen parsing regression'

      - name: Run SLH-DSA Nondeterministic signing rejection regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          evidence="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-evidence"
          python -m unittest -v test_pq_vector_modes.PqVectorModeTests.test_slhdsa_rejects_nondeterministic_signatures \
            2>&1 | tee "$evidence/slhdsa-parser-nondeterministic.log"
          grep -Eq '^Ran 1 test in' "$evidence/slhdsa-parser-nondeterministic.log"
          grep -Eq '^OK$' "$evidence/slhdsa-parser-nondeterministic.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/slhdsa-parser-nondeterministic.log"; then
            echo 'FAIL: SLH-DSA Nondeterministic signing rejection regression' >&2
            exit 1
          fi
          echo PASS > "$evidence/slhdsa-parser-nondeterministic.status"
          echo 'PASS: SLH-DSA Nondeterministic signing rejection regression'

      - name: Run SLH-DSA Unsupported prehash rejection regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          evidence="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-evidence"
          python -m unittest -v test_pq_vector_modes.PqVectorModeTests.test_slhdsa_rejects_prehash \
            2>&1 | tee "$evidence/slhdsa-parser-prehash.log"
          grep -Eq '^Ran 1 test in' "$evidence/slhdsa-parser-prehash.log"
          grep -Eq '^OK$' "$evidence/slhdsa-parser-prehash.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/slhdsa-parser-prehash.log"; then
            echo 'FAIL: SLH-DSA Unsupported prehash rejection regression' >&2
            exit 1
          fi
          echo PASS > "$evidence/slhdsa-parser-prehash.status"
          echo 'PASS: SLH-DSA Unsupported prehash rejection regression'

      - name: Run SLH-DSA-SHAKE-128s native signing and ACVP vector replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          export QSC_ACVP_PQ_LIBRARY="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-build/libqsc_acvp_pq.so"
          evidence="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-evidence"
          python -m unittest -v test_pq_signature_native.PqSignatureNativeTests.test_slhdsa128s \
            2>&1 | tee "$evidence/slhdsa128s-native.log"
          grep -Eq '^Ran 1 test in' "$evidence/slhdsa128s-native.log"
          grep -Eq '^OK$' "$evidence/slhdsa128s-native.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/slhdsa128s-native.log"; then
            echo 'FAIL: SLH-DSA-SHAKE-128s native signing, verification or vector replay' >&2
            exit 1
          fi
          echo PASS > "$evidence/slhdsa128s-native.status"
          echo 'PASS: SLH-DSA-SHAKE-128s native signing, rejection and vector replay'

      - name: Run SLH-DSA-SHAKE-128f native signing and ACVP vector replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          export QSC_ACVP_PQ_LIBRARY="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-build/libqsc_acvp_pq.so"
          evidence="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-evidence"
          python -m unittest -v test_pq_signature_native.PqSignatureNativeTests.test_slhdsa128f \
            2>&1 | tee "$evidence/slhdsa128f-native.log"
          grep -Eq '^Ran 1 test in' "$evidence/slhdsa128f-native.log"
          grep -Eq '^OK$' "$evidence/slhdsa128f-native.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/slhdsa128f-native.log"; then
            echo 'FAIL: SLH-DSA-SHAKE-128f native signing, verification or vector replay' >&2
            exit 1
          fi
          echo PASS > "$evidence/slhdsa128f-native.status"
          echo 'PASS: SLH-DSA-SHAKE-128f native signing, rejection and vector replay'

      - name: Run SLH-DSA-SHAKE-192s native signing and ACVP vector replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          export QSC_ACVP_PQ_LIBRARY="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-build/libqsc_acvp_pq.so"
          evidence="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-evidence"
          python -m unittest -v test_pq_signature_native.PqSignatureNativeTests.test_slhdsa192s \
            2>&1 | tee "$evidence/slhdsa192s-native.log"
          grep -Eq '^Ran 1 test in' "$evidence/slhdsa192s-native.log"
          grep -Eq '^OK$' "$evidence/slhdsa192s-native.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/slhdsa192s-native.log"; then
            echo 'FAIL: SLH-DSA-SHAKE-192s native signing, verification or vector replay' >&2
            exit 1
          fi
          echo PASS > "$evidence/slhdsa192s-native.status"
          echo 'PASS: SLH-DSA-SHAKE-192s native signing, rejection and vector replay'

      - name: Run SLH-DSA-SHAKE-192f native signing and ACVP vector replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          export QSC_ACVP_PQ_LIBRARY="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-build/libqsc_acvp_pq.so"
          evidence="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-evidence"
          python -m unittest -v test_pq_signature_native.PqSignatureNativeTests.test_slhdsa192f \
            2>&1 | tee "$evidence/slhdsa192f-native.log"
          grep -Eq '^Ran 1 test in' "$evidence/slhdsa192f-native.log"
          grep -Eq '^OK$' "$evidence/slhdsa192f-native.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/slhdsa192f-native.log"; then
            echo 'FAIL: SLH-DSA-SHAKE-192f native signing, verification or vector replay' >&2
            exit 1
          fi
          echo PASS > "$evidence/slhdsa192f-native.status"
          echo 'PASS: SLH-DSA-SHAKE-192f native signing, rejection and vector replay'

      - name: Run SLH-DSA-SHAKE-256s native signing and ACVP vector replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          export QSC_ACVP_PQ_LIBRARY="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-build/libqsc_acvp_pq.so"
          evidence="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-evidence"
          python -m unittest -v test_pq_signature_native.PqSignatureNativeTests.test_slhdsa256s \
            2>&1 | tee "$evidence/slhdsa256s-native.log"
          grep -Eq '^Ran 1 test in' "$evidence/slhdsa256s-native.log"
          grep -Eq '^OK$' "$evidence/slhdsa256s-native.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/slhdsa256s-native.log"; then
            echo 'FAIL: SLH-DSA-SHAKE-256s native signing, verification or vector replay' >&2
            exit 1
          fi
          echo PASS > "$evidence/slhdsa256s-native.status"
          echo 'PASS: SLH-DSA-SHAKE-256s native signing, rejection and vector replay'

      - name: Run SLH-DSA-SHAKE-256f native signing and ACVP vector replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/Source/ACVP/tests"
          export QSC_ACVP_PQ_LIBRARY="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-build/libqsc_acvp_pq.so"
          evidence="$RUNNER_TEMP/qsc-acvp-slhdsa-scalar-evidence"
          python -m unittest -v test_pq_signature_native.PqSignatureNativeTests.test_slhdsa256f \
            2>&1 | tee "$evidence/slhdsa256f-native.log"
          grep -Eq '^Ran 1 test in' "$evidence/slhdsa256f-native.log"
          grep -Eq '^OK$' "$evidence/slhdsa256f-native.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/slhdsa256f-native.log"; then
            echo 'FAIL: SLH-DSA-SHAKE-256f native signing, verification or vector replay' >&2
            exit 1
          fi
          echo PASS > "$evidence/slhdsa256f-native.status"
          echo 'PASS: SLH-DSA-SHAKE-256f native signing, rejection and vector replay'

      - name: Generate sanitized fail-closed SLH-DSA evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-slhdsa-scalar-evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          expected = {
              'native_128s': 'slhdsa128s-native.status',
              'native_128f': 'slhdsa128f-native.status',
              'native_192s': 'slhdsa192s-native.status',
              'native_192f': 'slhdsa192f-native.status',
              'native_256s': 'slhdsa256s-native.status',
              'native_256f': 'slhdsa256f-native.status',
              'parser_keygen': 'slhdsa-parser-keygen.status',
              'parser_nondeterministic': 'slhdsa-parser-nondeterministic.status',
              'parser_prehash': 'slhdsa-parser-prehash.status',
          }
          results = {}
          for name, filename in expected.items():
              try:
                  results[name] = (evidence / filename).read_text(
                      encoding='utf-8').strip() == 'PASS'
              except OSError:
                  results[name] = False
          config_ok = (evidence / 'build-configuration.txt').is_file()
          complete = all(results.values()) and config_ok
          record = {
              'type': 'QSC_LINUX_SCALAR_SLHDSA_FIPS205_OFFLINE_NOT_ACVTS',
              'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'qsc_git_sha': os.environ.get('QSC_DEPENDENCY_SHA', 'NOT_RECORDED'),
              'qualification_git_sha': os.environ.get('GITHUB_SHA', 'NOT_RECORDED'),
              'runner': 'ubuntu-24.04',
              'architecture': 'x86_64',
              'isa_profile': 'scalar',
              'algorithms': ['SLH-DSA-SHAKE-128s', 'SLH-DSA-SHAKE-128f', 'SLH-DSA-SHAKE-192s', 'SLH-DSA-SHAKE-192f', 'SLH-DSA-SHAKE-256s', 'SLH-DSA-SHAKE-256f'],
              'native_test_count': sum(results[key] for key in ('native_128s', 'native_128f', 'native_192s', 'native_192f', 'native_256s', 'native_256f')),
              'parser_regression_count': sum(results[key] for key in ('parser_keygen', 'parser_nondeterministic', 'parser_prehash')),
              'test_results': results,
              'build_configuration': 'PRESENT' if config_ok else 'MISSING',
              'nist_demo': 'NOT_RUN',
              'external_acvts_verdict': 'NOT_RUN',
              'complete_library_qualification': False,
              'status': 'OFFLINE_SLHDSA_PASS' if complete else 'FAIL_OR_INCOMPLETE',
          }
          (evidence / 'run-manifest.json').write_text(
              json.dumps(record, indent=2) + '\n', encoding='utf-8')
          print('Linux scalar SLH-DSA offline checks:', record['status'])
          PY

      - name: Upload sanitized SLH-DSA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsc-acvp-linux-x64-scalar-slhdsa-offline
          path: ${{ runner.temp }}/qsc-acvp-slhdsa-scalar-evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Enforce complete independent SLH-DSA evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-slhdsa-scalar-evidence/run-manifest.json'
          if not path.is_file() or json.loads(path.read_text(encoding='utf-8')).get('status') != 'OFFLINE_SLHDSA_PASS':
              raise SystemExit('FAIL: Linux scalar SLH-DSA evidence is incomplete')
          print('PASS: standalone SLH-DSA offline tests (not NIST validation)')
          PY
