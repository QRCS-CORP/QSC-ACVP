# Credential-free NIST ACVTS Demo client readiness regression checks.
name: QSC ACVP Demo client protocol readiness (offline)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsc-acvp-sequential-qualification
  cancel-in-progress: false

jobs:
  demo-protocol-readiness:
    name: Credential-free ACVTS client regression verification
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout reviewed qualification branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile-check ACVP Python sources without live credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q Source/ACVP
          echo 'PASS: ACVP Python source syntax verified'

      - name: Verify Demo protocol client and mock server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qsc-acvp-demo-readiness"
          python -m unittest discover -s Source/ACVP/tests -p test_demo_client.py -v \
            2>&1 | tee "$RUNNER_TEMP/qsc-acvp-demo-readiness/demo-client-tests.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/qsc-acvp-demo-readiness/demo-client-tests.log"
          if grep -Eq 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/qsc-acvp-demo-readiness/demo-client-tests.log"; then
            echo 'FAIL: Demo client test suite is not complete' >&2
            exit 1
          fi
          echo 'PASS: Demo client credential-free protocol tests'

      - name: Verify existing-session verdict-only client
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s Source/ACVP/tests -p test_verdict_client.py -v \
            2>&1 | tee "$RUNNER_TEMP/qsc-acvp-demo-readiness/verdict-client-tests.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/qsc-acvp-demo-readiness/verdict-client-tests.log"
          if grep -Eq 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/qsc-acvp-demo-readiness/verdict-client-tests.log"; then
            echo 'FAIL: verdict-only recovery tests are incomplete' >&2
            exit 1
          fi
          echo 'PASS: existing-session check remains read-only and fail-closed'

      - name: Verify AES-ECB functional and Monte Carlo vector parsing
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s Source/ACVP/tests -p test_aes_vectors.py -v \
            2>&1 | tee "$RUNNER_TEMP/qsc-acvp-demo-readiness/aes-vector-tests.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/qsc-acvp-demo-readiness/aes-vector-tests.log"
          if grep -Eq 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/qsc-acvp-demo-readiness/aes-vector-tests.log"; then
            echo 'FAIL: AES vector adapter regressions incomplete' >&2
            exit 1
          fi
          echo 'PASS: AES-ECB multi-block AFT and single-block MCT regression checks'

      - name: Verify AES-CTR counter-test and AFT vector parsing
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s Source/ACVP/tests -p test_aes_modes.py -v \
            2>&1 | tee "$RUNNER_TEMP/qsc-acvp-demo-readiness/aes-modes-tests.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/qsc-acvp-demo-readiness/aes-modes-tests.log"
          if grep -Eq 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/qsc-acvp-demo-readiness/aes-modes-tests.log"; then
            echo 'FAIL: AES-CTR counter and AFT regression checks' >&2
            exit 1
          fi
          echo 'PASS: AES-CTR counter tests omit payloadLen; AFT remains strict'

      - name: Verify PBKDF ACVP registration and vector-format compatibility
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="Source/ACVP:Source/ACVP/tests" \
            python -m unittest test_kdf_vectors.KeyDerivationSchemaTests -v \
            2>&1 | tee "$RUNNER_TEMP/qsc-acvp-demo-readiness/pbkdf-schema-tests.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/qsc-acvp-demo-readiness/pbkdf-schema-tests.log"
          if grep -Eq 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/qsc-acvp-demo-readiness/pbkdf-schema-tests.log"; then
            echo 'FAIL: PBKDF ACVP schema regressions incomplete' >&2
            exit 1
          fi
          echo 'PASS: PBKDF ACVP schema, length and prerequisite regressions'

      - name: Verify ML-KEM FIPS203-tr1 schema and mode compatibility offline
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s Source/ACVP/tests -p test_mlkem_vectors.py -v \
            2>&1 | tee "$RUNNER_TEMP/qsc-acvp-demo-readiness/mlkem-schema-tests.log"
          grep -Eq '^Ran 16 tests in' "$RUNNER_TEMP/qsc-acvp-demo-readiness/mlkem-schema-tests.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/qsc-acvp-demo-readiness/mlkem-schema-tests.log"
          if grep -Eq 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/qsc-acvp-demo-readiness/mlkem-schema-tests.log"; then
            echo 'FAIL: ML-KEM FIPS203-tr1 compatibility regression' >&2
            exit 1
          fi
          echo 'PASS: ML-KEM keyGen and expanded-key encapDecap schema'

      - name: Verify ML-DSA FIPS204-tr1 vectors and restricted signing modes offline
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s Source/ACVP/tests -p test_pq_vector_modes.py -v \
            2>&1 | tee "$RUNNER_TEMP/qsc-acvp-demo-readiness/pq-modes-tests.log"
          grep -Eq '^Ran 14 tests in' "$RUNNER_TEMP/qsc-acvp-demo-readiness/pq-modes-tests.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/qsc-acvp-demo-readiness/pq-modes-tests.log"
          if grep -Eq 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/qsc-acvp-demo-readiness/pq-modes-tests.log"; then
            echo 'FAIL: ML-DSA signing mode compatibility tests' >&2
            exit 1
          fi
          echo 'PASS: ML-DSA keyGen/sigGen/sigVer and signature mode schema'

      - name: Verify credentials are absent from regression process
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ACVP_TOTP_SEED:-}"
          test -z "${ACVP_DEMO_CERT_B64:-}"
          test -z "${ACVP_DEMO_KEY_B64:-}"
          echo 'PASS: credential-free tests did not require live ACVTS identity'

      - name: Write sanitized readiness manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-demo-readiness'
          out.mkdir(parents=True, exist_ok=True)
          primary = out / 'demo-client-tests.log'
          recovery = out / 'verdict-client-tests.log'
          data = primary.read_text(encoding='utf-8') if primary.is_file() else ''
          verification = recovery.read_text(encoding='utf-8') if recovery.is_file() else ''
          passed = (('\nOK\n' in data and 'Ran 36 tests' in data and
                     'FAILED' not in data and 'ERROR' not in data and 'skipped=' not in data)
                    and ('\nOK\n' in verification and 'Ran 6 tests' in verification and
                         'FAILED' not in verification and 'ERROR' not in verification
                         and 'skipped=' not in verification))
          aes_path = out / 'aes-vector-tests.log'
          aes = aes_path.read_text(encoding='utf-8') if aes_path.is_file() else ''
          passed = passed and ('\nOK\n' in aes and 'Ran 17 tests' in aes and
                               'FAILED' not in aes and 'ERROR' not in aes and
                               'skipped=' not in aes)
          ctr_path = out / 'aes-modes-tests.log'
          ctr = ctr_path.read_text(encoding='utf-8') if ctr_path.is_file() else ''
          passed = passed and ('\nOK\n' in ctr and 'Ran 18 tests' in ctr and
                               'FAILED' not in ctr and 'ERROR' not in ctr and
                               'skipped=' not in ctr)
          pbkdf_path = out / 'pbkdf-schema-tests.log'
          pbkdf = pbkdf_path.read_text(encoding='utf-8') if pbkdf_path.is_file() else ''
          passed = passed and ('\nOK\n' in pbkdf and 'Ran 11 tests' in pbkdf and
                               'FAILED' not in pbkdf and 'ERROR' not in pbkdf and
                               'skipped=' not in pbkdf)
          mlkem_path = out / 'mlkem-schema-tests.log'
          mlkem = mlkem_path.read_text(encoding='utf-8') if mlkem_path.is_file() else ''
          passed = passed and ('\nOK\n' in mlkem and 'Ran 16 tests' in mlkem and
                               'FAILED' not in mlkem and 'ERROR' not in mlkem and
                               'skipped=' not in mlkem)
          pq_modes_path = out / 'pq-modes-tests.log'
          pq_modes = pq_modes_path.read_text(encoding='utf-8') if pq_modes_path.is_file() else ''
          passed = passed and ('\nOK\n' in pq_modes and 'Ran 14 tests' in pq_modes and
                               'FAILED' not in pq_modes and 'ERROR' not in pq_modes and
                               'skipped=' not in pq_modes)
          report = {
              'type': 'ACVTS_DEMO_CREDENTIAL_FREE_PROTOCOL_READINESS',
              'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'qualification_sha': os.environ.get('GITHUB_SHA', 'NOT_RECORDED'),
              'nist_demo': 'NOT_CONTACTED',
              'credentials': 'NOT_USED',
              'status': 'OFFLINE_DEMO_PROTOCOL_PASS' if passed else 'FAIL_OR_INCOMPLETE',
          }
          (out / 'run-manifest.json').write_text(json.dumps(report, indent=2) + '\n',
                                                 encoding='utf-8')
          print('Offline Demo protocol readiness:', report['status'])
          PY

      - name: Upload sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsc-acvp-demo-protocol-readiness-offline
          path: ${{ runner.temp }}/qsc-acvp-demo-readiness/
          retention-days: 14
          if-no-files-found: error

      - name: Enforce successful client regression evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-demo-readiness/run-manifest.json'
          if not path.is_file() or json.loads(path.read_text(encoding='utf-8')).get('status') != 'OFFLINE_DEMO_PROTOCOL_PASS':
              raise SystemExit('FAIL: credential-free Demo protocol evidence is incomplete')
          print('PASS: credential-free Demo client regression evidence')
          PY
