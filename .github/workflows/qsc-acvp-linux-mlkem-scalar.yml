# Independent FIPS 203 ML-KEM adapter smoke coverage; manual only, not NIST validation.
name: QSC ACVP Linux x64 scalar ML-KEM offline qualification

on:
  workflow_dispatch:
    inputs:
      qsc_ref:
        description: 'Immutable 40-character QSC source commit to qualify'
        type: string
        required: true
        default: 43c8aa2afe9d38c3ddf9bac0107196545981ac28

permissions:
  contents: read

concurrency:
  group: qsc-acvp-sequential-qualification
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  linux-mlkem-scalar:
    name: Linux x64 scalar FIPS 203 ML-KEM adapter checks
    if: github.repository == 'QRCS-CORP/QSC-ACVP'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout reviewed qualification revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pinned QSC dependency read-only
        uses: actions/checkout@v4
        with:
          repository: QRCS-CORP/QSC
          ref: ${{ inputs.qsc_ref }}
          path: dependency/QSC
          persist-credentials: false

      - name: Verify pinned QSC revision and Linux x64 target
        shell: bash
        env:
          QSC_REQUESTED_SHA: ${{ inputs.qsc_ref }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          if [[ ! "$QSC_REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'FAIL: an immutable 40-character lowercase QSC revision is mandatory' >&2
            exit 1
          fi
          sha="$(git -C dependency/QSC rev-parse HEAD)"
          if [[ "$sha" != "$QSC_REQUESTED_SHA" ]]; then
            echo 'FAIL: QSC checkout differs from requested immutable revision' >&2
            exit 1
          fi
          printf 'QSC_DEPENDENCY_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          echo "QSC source commit: $sha"
          echo "Qualification commit: $(git rev-parse HEAD)"

      - name: Configure isolated Linux scalar compilation profile
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S Source/ACVP -B "$RUNNER_TEMP/qsc-acvp-mlkem-scalar-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQSC_ACVP_TLS_CLASS=3 \
            -DQSC_ACVP_ISA_PROFILE=scalar
          grep -q '^QSC_ACVP_PROFILE_MACROS_VERIFIED:INTERNAL=1$' \
            "$RUNNER_TEMP/qsc-acvp-mlkem-scalar-build/CMakeCache.txt"

      - name: Record source and compilation configuration
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qsc-acvp-mlkem-scalar-evidence"
          mkdir -p "$evidence"
          {
            printf 'QSC source commit: %s\n' "$QSC_DEPENDENCY_SHA"
            printf 'Qualification commit: %s\n' "$GITHUB_SHA"
            printf 'Operating system: %s\n' "$(uname -s)"
            printf 'Architecture: %s\n' "$(uname -m)"
            printf 'Test family: ML-KEM FIPS 203 three parameter sets\n'
            printf 'ISA profile: scalar\nTLS class: 3\n'
            cc --version | head -n 1
            grep -E '^(QSC_ACVP_ISA_PROFILE|QSC_ACVP_TLS_CLASS|QSC_ACVP_PROFILE_MACROS_VERIFIED):' \
              "$RUNNER_TEMP/qsc-acvp-mlkem-scalar-build/CMakeCache.txt"
          } > "$evidence/build-configuration.txt"

      - name: Build pinned QSC native post-quantum library
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/qsc-acvp-mlkem-scalar-build" \
            --target qsc_acvp_pq --parallel 2
          test -s "$RUNNER_TEMP/qsc-acvp-mlkem-scalar-build/libqsc_acvp_pq.so"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ML-KEM parser, registration and fail-closed regression tests
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qsc-acvp-mlkem-scalar-evidence"
          python -m unittest discover -s Source/ACVP/tests -p test_mlkem_vectors.py -v \
            2>&1 | tee "$evidence/mlkem-parser-regressions.log"
          grep -Eq '^Ran 12 tests in' "$evidence/mlkem-parser-regressions.log"
          grep -Eq '^OK$' "$evidence/mlkem-parser-regressions.log"
          if grep -Eq 'skipped=|FAILED|ERROR' "$evidence/mlkem-parser-regressions.log"; then
            echo 'FAIL: parser regressions skipped or failed' >&2
            exit 1
          fi
          echo 'PASS' > "$evidence/mlkem-parser-regressions.status"

      - name: Run ML-KEM-512, ML-KEM-768 and ML-KEM-1024 native tests
        shell: bash
        run: |
          set -euo pipefail
          python Source/ACVP/mlkem_check.py \
            --library "$RUNNER_TEMP/qsc-acvp-mlkem-scalar-build/libqsc_acvp_pq.so" \
            --output "$RUNNER_TEMP/qsc-acvp-mlkem-scalar-evidence"

      - name: Generate sanitized fail-closed ML-KEM evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-mlkem-scalar-evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          passed = False
          status = 'NOT_RUN_OR_UNREADABLE'
          count = 0
          try:
              data = json.loads((evidence / 'mlkem-results.json').read_text(encoding='utf-8'))
              status = data.get('status', 'MISSING')
              count = data.get('native_tests', 0)
              passed = (status == 'PASS_LOCAL_ADAPTER_ONLY'
                        and count == 3
                        and data.get('parameter_sets') == ['ML-KEM-512', 'ML-KEM-768', 'ML-KEM-1024'])
          except (OSError, ValueError, AttributeError, TypeError):
              pass
          parser_ok = (evidence / 'mlkem-parser-regressions.status').is_file()
          config_ok = (evidence / 'build-configuration.txt').is_file()
          complete = passed and parser_ok and config_ok
          record = {
              'type': 'QSC_LINUX_SCALAR_MLKEM_FIPS203_OFFLINE_NOT_ACVTS',
              'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'qsc_git_sha': os.environ.get('QSC_DEPENDENCY_SHA', 'NOT_RECORDED'),
              'qualification_git_sha': os.environ.get('GITHUB_SHA', 'NOT_RECORDED'),
              'runner': 'ubuntu-24.04',
              'architecture': 'x86_64',
              'isa_profile': 'scalar',
              'algorithms': ['ML-KEM-512', 'ML-KEM-768', 'ML-KEM-1024'],
              'native_test_count': count,
              'native_test_status': status,
              'parser_regressions': 'PASS' if parser_ok else 'MISSING',
              'build_configuration': 'PRESENT' if config_ok else 'MISSING',
              'nist_demo': 'NOT_RUN',
              'external_acvts_verdict': 'NOT_RUN',
              'complete_library_qualification': False,
              'status': 'OFFLINE_MLKEM_PASS' if complete else 'FAIL_OR_INCOMPLETE',
          }
          (evidence / 'run-manifest.json').write_text(json.dumps(record, indent=2) + '\n',
                                                       encoding='utf-8')
          print('Linux scalar ML-KEM offline checks:', record['status'])
          PY

      - name: Upload sanitized ML-KEM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsc-acvp-linux-x64-scalar-mlkem-offline
          path: ${{ runner.temp }}/qsc-acvp-mlkem-scalar-evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Enforce complete independent ML-KEM evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-mlkem-scalar-evidence/run-manifest.json'
          if not path.is_file() or json.loads(path.read_text(encoding='utf-8')).get('status') != 'OFFLINE_MLKEM_PASS':
              raise SystemExit('FAIL: Linux scalar ML-KEM evidence is incomplete')
          print('PASS: standalone ML-KEM offline tests (not NIST validation)')
          PY
