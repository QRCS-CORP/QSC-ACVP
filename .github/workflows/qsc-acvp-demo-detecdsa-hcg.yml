# NIST ACVTS Demo DetECDSA with same-session native HCG; manual and protected.
name: QSC ACVTS Demo DetECDSA HCG sample (manual)

on:
  workflow_dispatch:
    inputs:
      qsc_ref:
        description: 'Immutable production QSC source revision'
        required: true
        type: string
        default: '5d85f25866f9fa08654791265f08f43f95674a53'
      approve_nist_network_session:
        description: 'I authorize one real authenticated NIST Demo DetECDSA session'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qsc-acvp-nist-demo-exclusive
  cancel-in-progress: false

jobs:
  authenticated-detecdsa:
    name: NIST Demo DetECDSA keyGen keyVer sigVer with same-session HCG
    if: github.repository == 'QRCS-CORP/QSC-ACVP'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: acvts-demo

    steps:
      - name: Require explicit operator authorization and protected environment
        shell: bash
        env:
          REQUEST_APPROVAL: ${{ inputs.approve_nist_network_session }}
          DEMO_ENABLED: ${{ vars.ACVTS_DEMO_ENABLED }}
        run: |
          set -euo pipefail
          test "$REQUEST_APPROVAL" = true || { echo 'FAIL: live DetECDSA session not approved'; exit 1; }
          test "$DEMO_ENABLED" = true || { echo 'FAIL: protected acvts-demo environment not enabled'; exit 1; }
          echo 'PASS: explicit operator and environment approval'

      - name: Checkout approved ECC qualification adapter
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout immutable production QSC read-only
        uses: actions/checkout@v4
        with:
          repository: QRCS-CORP/QSC
          ref: ${{ inputs.qsc_ref }}
          path: dependency/QSC
          persist-credentials: false

      - name: Verify immutable QSC source revision
        shell: bash
        env:
          REQUIRED_SHA: ${{ inputs.qsc_ref }}
        run: |
          set -euo pipefail
          [[ "$REQUIRED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'FAIL: expected immutable QSC source SHA'; exit 1; }
          test "$(git -C dependency/QSC rev-parse HEAD)" = "$REQUIRED_SHA" || { echo 'FAIL: QSC source mismatch'; exit 1; }
          echo 'PASS: source-pinned complete QSC ECC and HCG'

      - name: Build full scalar QSC DetECDSA HMAC DRBG and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S Source/ACVP -B "$RUNNER_TEMP/qsc-acvts-detecdsa-hcg-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQSC_ACVP_TLS_CLASS=3 \
            -DQSC_ACVP_ISA_PROFILE=scalar
          grep -q '^QSC_ACVP_PROFILE_MACROS_VERIFIED:INTERNAL=1$' \
            "$RUNNER_TEMP/qsc-acvts-detecdsa-hcg-build/CMakeCache.txt"
          cmake --build "$RUNNER_TEMP/qsc-acvts-detecdsa-hcg-build" \
            --target qsc_acvp_ecc qsc_acvp_drbg qsc_acvp_hash --parallel 2
          test -s "$RUNNER_TEMP/qsc-acvts-detecdsa-hcg-build/libqsc_acvp_ecc.so"
          test -s "$RUNNER_TEMP/qsc-acvts-detecdsa-hcg-build/libqsc_acvp_drbg.so"
          test -s "$RUNNER_TEMP/qsc-acvts-detecdsa-hcg-build/libqsc_acvp_hash.so"
          echo 'PASS: full P-256/P-384/P-521 ECC and native HCG build'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install independent ECC reference
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cryptography==46.0.4

      - name: Require complete native ECC and HCG offline preflight
        shell: bash
        env:
          QSC_ACVP_ECC_LIBRARY: ${{ runner.temp }}/qsc-acvts-detecdsa-hcg-build/libqsc_acvp_ecc.so
          QSC_ACVP_ECC_COMPLETE: '1'
          QSC_ACVP_DRBG_LIBRARY: ${{ runner.temp }}/qsc-acvts-detecdsa-hcg-build/libqsc_acvp_drbg.so
        run: |
          set -euo pipefail
          python -m compileall -q Source/ACVP
          PYTHONPATH="Source/ACVP:Source/ACVP/tests" \
            python -m unittest \
              test_drbg_native.DrbgNativeTests \
              test_demo_client.DemoClientTests \
              test_ecc_vectors.ECCVectorTests \
              test_ecc_vectors.ECCNativeVectorTests \
              test_ecc_hcg_native.EccHcgNativeTests -v \
            2>&1 | tee "$RUNNER_TEMP/qsc-detecdsa-hcg-native-preflight.log"
          grep -Eq '^Ran 110 tests in' "$RUNNER_TEMP/qsc-detecdsa-hcg-native-preflight.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/qsc-detecdsa-hcg-native-preflight.log"
          if grep -Eq 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/qsc-detecdsa-hcg-native-preflight.log"; then
            echo 'FAIL: native DetECDSA HCG preflight incomplete' >&2
            exit 1
          fi
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("Source/ACVP").resolve()))
          from demo_client import registration
          selected = ("SHA2-256", "SHA2-384", "SHA2-512",
                      "HMAC-SHA2-512", "hmacDRBG", "DetECDSA")
          entries = registration(selected, "same")[1]["algorithms"]
          registered = [entry for entry in entries if entry["algorithm"] == "DetECDSA"]
          if ([entry.get("mode") for entry in registered] !=
                  ["sigGen"] or
                  any(entry["prereqVals"][0] !=
                      {"algorithm": "DRBG", "valValue": "same"}
                      for entry in registered)):
              raise SystemExit("FAIL: DetECDSA/HCG same-session capability registration")
          if (len(registered) != 1 or
                  registered[0].get("componentTest") is not False):
              raise SystemExit("FAIL: DetECDSA component mode must not be registered")
          print("PASS: full DetECDSA sigGen with same-session native HCG")
          PY

      - name: Materialize protected NIST identity
        shell: bash
        env:
          NIST_CERT_B64: ${{ secrets.ACVTS_DEMO_CERT_B64 }}
          NIST_KEY_B64: ${{ secrets.ACVTS_DEMO_KEY_B64 }}
          NIST_TOTP_SEED_B64: ${{ secrets.ACVTS_DEMO_TOTP_B64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$NIST_CERT_B64" || { echo 'FAIL: missing client certificate'; exit 1; }
          test -n "$NIST_KEY_B64" || { echo 'FAIL: missing client private key'; exit 1; }
          test -n "$NIST_TOTP_SEED_B64" || { echo 'FAIL: missing TOTP credential'; exit 1; }
          printf '%s' "$NIST_CERT_B64" | base64 --decode > "$RUNNER_TEMP/acvts-detecdsa-cert.pem"
          printf '%s' "$NIST_KEY_B64" | base64 --decode > "$RUNNER_TEMP/acvts-detecdsa-key.pem"
          openssl x509 -noout -in "$RUNNER_TEMP/acvts-detecdsa-cert.pem" >/dev/null
          openssl pkey -noout -in "$RUNNER_TEMP/acvts-detecdsa-key.pem" >/dev/null
          cert_key="$(openssl x509 -in "$RUNNER_TEMP/acvts-detecdsa-cert.pem" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | awk '{print $1}')"
          private_key="$(openssl pkey -in "$RUNNER_TEMP/acvts-detecdsa-key.pem" -pubout -outform DER | sha256sum | awk '{print $1}')"
          test "$cert_key" = "$private_key" || { echo 'FAIL: client certificate and private key do not match'; exit 1; }
          echo 'PASS: protected NIST client identity verified'

      - name: Run exactly one live DetECDSA HCG NIST Demo session
        shell: bash
        env:
          ACVP_TOTP_SEED: ${{ secrets.ACVTS_DEMO_TOTP_B64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          output="$RUNNER_TEMP/qsc-acvp-detecdsa-demo-results"
          mkdir -p "$output"
          python Source/ACVP/demo_client.py \
            --library "$RUNNER_TEMP/qsc-acvts-detecdsa-hcg-build/libqsc_acvp_hash.so" \
            --drbg-library "$RUNNER_TEMP/qsc-acvts-detecdsa-hcg-build/libqsc_acvp_drbg.so" \
            --ecc-library "$RUNNER_TEMP/qsc-acvts-detecdsa-hcg-build/libqsc_acvp_ecc.so" \
            --cert "$RUNNER_TEMP/acvts-detecdsa-cert.pem" \
            --key "$RUNNER_TEMP/acvts-detecdsa-key.pem" \
            --output "$output" \
            --algorithms SHA2-256 SHA2-384 SHA2-512 HMAC-SHA2-512 hmacDRBG DetECDSA
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "qsc-acvp-detecdsa-demo-results/demo-results.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          selected = ["SHA2-256", "SHA2-384", "SHA2-512",
                      "HMAC-SHA2-512", "hmacDRBG", "DetECDSA"]
          detecdsa_modes = {v.get("mode") for v in data.get("vectors", [])
                         if v.get("algorithm") == "DetECDSA"}
          if (data.get("status") != "PASS_DEMO_SAMPLE" or
                  data.get("server_passed") is not True or
                  data.get("registration_algorithms") != selected or
                  detecdsa_modes != {"sigGen"}):
              raise SystemExit("FAIL: DetECDSA complete-mode NIST Demo verdict")
          print("PASS: NIST server DetECDSA keyGen/keyVer/sigVer with HCG")
          PY

      - name: Delete ephemeral NIST identity
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/acvts-detecdsa-cert.pem" "$RUNNER_TEMP/acvts-detecdsa-key.pem"

      - name: Upload sanitized DetECDSA verdict only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsc-acvp-real-nist-demo-detecdsa-hcg
          path: ${{ runner.temp }}/qsc-acvp-detecdsa-demo-results/demo-results.json
          if-no-files-found: warn
          retention-days: 7
