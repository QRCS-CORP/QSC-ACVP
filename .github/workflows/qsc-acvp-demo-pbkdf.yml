# NIST ACVTS Demo PBKDF sample. Explicitly gated by an approved GitHub Environment.
name: QSC ACVTS Demo authenticated PBKDF sample (manual)

on:
  workflow_dispatch:
    inputs:
      qsc_ref:
        description: 'Immutable production QSC source revision'
        required: true
        type: string
        default: '43c8aa2afe9d38c3ddf9bac0107196545981ac28'
      approve_nist_network_session:
        description: 'I authorize one real authenticated NIST Demo sample session'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qsc-acvp-nist-demo-exclusive
  cancel-in-progress: false

jobs:
  authenticated-demo-sample:
    name: NIST Demo PBKDF sample
    if: github.repository == 'QRCS-CORP/QSC-ACVP'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: acvts-demo

    steps:
      - name: Require explicit operator authorization and protected environment
        shell: bash
        env:
          REQUEST_APPROVAL: ${{ inputs.approve_nist_network_session }}
          DEMO_ENABLED: ${{ vars.ACVTS_DEMO_ENABLED }}
        run: |
          set -euo pipefail
          test "$REQUEST_APPROVAL" = true || { echo 'FAIL: live NIST session not approved in dispatch'; exit 1; }
          test "$DEMO_ENABLED" = true || { echo 'FAIL: protected acvts-demo environment not enabled'; exit 1; }
          echo 'PASS: explicit operator and environment approval'

      - name: Checkout approved QSC qualification adapter
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout immutable QSC dependency read-only
        uses: actions/checkout@v4
        with:
          repository: QRCS-CORP/QSC
          ref: ${{ inputs.qsc_ref }}
          path: dependency/QSC
          persist-credentials: false

      - name: Verify QSC source provenance
        shell: bash
        env:
          REQUIRED_SHA: ${{ inputs.qsc_ref }}
        run: |
          set -euo pipefail
          [[ "$REQUIRED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'FAIL: expected immutable QSC commit SHA'; exit 1; }
          actual="$(git -C dependency/QSC rev-parse HEAD)"
          test "$actual" = "$REQUIRED_SHA" || { echo 'FAIL: QSC source SHA mismatch'; exit 1; }
          echo "QSC_DEPENDENCY_SHA=$actual" >> "$GITHUB_ENV"
          echo 'PASS: pinned QSC dependency revision verified'

      - name: Compile minimal scalar SHA sample backend
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S Source/ACVP -B "$RUNNER_TEMP/qsc-acvts-demo-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQSC_ACVP_TLS_CLASS=3 \
            -DQSC_ACVP_ISA_PROFILE=scalar
          cmake --build "$RUNNER_TEMP/qsc-acvts-demo-build" --target qsc_acvp_hash --parallel 2
          test -s "$RUNNER_TEMP/qsc-acvts-demo-build/libqsc_acvp_hash.so"
          echo 'PASS: source-pinned standalone SHA sample library'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify QSC SHA-2 prerequisites, PBKDF2 native vectors, and registration offline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("Source/ACVP").resolve()))
          from demo_client import registration
          from kdf_client import QscKdf
          from local_client import QSC

          library = Path(os.environ["RUNNER_TEMP"]) / "qsc-acvts-demo-build/libqsc_acvp_hash.so"
          hashes = ("SHA2-256", "SHA2-384", "SHA2-512")
          digest = QSC(library)
          kdf = QscKdf(library)
          for name in hashes:
              suffix = name.replace("SHA2-", "sha")
              expected = hashlib.new(suffix, b"abc").hexdigest().upper()
              if digest.digest(name, b"abc", len(bytes.fromhex(expected)) * 8) != expected:
                  raise SystemExit("FAIL: pinned QSC SHA-2 prerequisite digest")
              for length, iterations in ((14, 10), (32, 123), (64, 1000)):
                  password = b"password1"
                  salt = bytes(range(16))
                  actual = kdf.pbkdf2(name, password, salt, iterations, length)
                  expected_key = hashlib.pbkdf2_hmac(
                      suffix, password, salt, iterations, length)
                  if actual != expected_key:
                      raise SystemExit("FAIL: pinned QSC PBKDF2 known-answer vector")

          selected = hashes + ("PBKDF",)
          selection = registration(selected)
          capabilities = selection[1].get("algorithms", []) if len(selection) == 2 else []
          if (len(selection) != 2 or selection[1].get("isSample") is not True or
                  [item.get("algorithm") for item in capabilities] != list(selected) or
                  capabilities[-1].get("prereqVals") !=
                  [{"algorithm": "SHA", "valValue": "same"}] or
                  capabilities[-1]["capabilities"][0].get("hmacAlg") != list(hashes)):
              raise SystemExit("FAIL: PBKDF same-session SHA prerequisite registration")
          print("PASS: native PBKDF2 SHA-256/384/512 KAT and three SHA prerequisites")
          PY

      - name: Verify PBKDF ACVP schema and native KDF regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q Source/ACVP
          export QSC_ACVP_HASH_LIBRARY="$RUNNER_TEMP/qsc-acvts-demo-build/libqsc_acvp_hash.so"
          python -m unittest discover -s Source/ACVP/tests -p test_kdf_vectors.py -v \
            2>&1 | tee "$RUNNER_TEMP/qsc-acvts-pbkdf-tests.log"
          grep -Eq '^Ran 21 tests' "$RUNNER_TEMP/qsc-acvts-pbkdf-tests.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/qsc-acvts-pbkdf-tests.log"
          if grep -Eq 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/qsc-acvts-pbkdf-tests.log"; then
            echo 'FAIL: PBKDF schema or native regression tests incomplete' >&2
            exit 1
          fi
          echo 'PASS: 21 PBKDF/KDF native and schema regression tests'

      - name: Materialize protected NIST mTLS and TOTP credentials
        shell: bash
        env:
          NIST_CERT_B64: ${{ secrets.ACVTS_DEMO_CERT_B64 }}
          NIST_KEY_B64: ${{ secrets.ACVTS_DEMO_KEY_B64 }}
          NIST_TOTP_SEED_B64: ${{ secrets.ACVTS_DEMO_TOTP_B64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$NIST_CERT_B64" || { echo 'FAIL: missing NIST certificate secret'; exit 1; }
          test -n "$NIST_KEY_B64" || { echo 'FAIL: missing NIST private-key secret'; exit 1; }
          test -n "$NIST_TOTP_SEED_B64" || { echo 'FAIL: missing NIST TOTP seed secret'; exit 1; }
          printf '%s' "$NIST_CERT_B64" | base64 --decode > "$RUNNER_TEMP/acvts-demo-cert.pem"
          printf '%s' "$NIST_KEY_B64" | base64 --decode > "$RUNNER_TEMP/acvts-demo-key.pem"
          openssl x509 -noout -in "$RUNNER_TEMP/acvts-demo-cert.pem" >/dev/null
          openssl pkey -noout -in "$RUNNER_TEMP/acvts-demo-key.pem" >/dev/null
          cert_key="$(openssl x509 -in "$RUNNER_TEMP/acvts-demo-cert.pem" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | awk '{print $1}')"
          private_key="$(openssl pkey -in "$RUNNER_TEMP/acvts-demo-key.pem" -pubout -outform DER | sha256sum | awk '{print $1}')"
          test "$cert_key" = "$private_key" || { echo 'FAIL: NIST mTLS certificate and private key do not match'; exit 1; }
          echo 'PASS: NIST identity material loaded without disclosing credentials'

      - name: Run exactly one live NIST Demo PBKDF with SHA-2 prerequisites
        shell: bash
        env:
          ACVP_TOTP_SEED: ${{ secrets.ACVTS_DEMO_TOTP_B64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          output="$RUNNER_TEMP/qsc-acvp-demo-verified-results"
          mkdir -p "$output"
          python Source/ACVP/demo_client.py \
            --library "$RUNNER_TEMP/qsc-acvts-demo-build/libqsc_acvp_hash.so" \
            --cert "$RUNNER_TEMP/acvts-demo-cert.pem" \
            --key "$RUNNER_TEMP/acvts-demo-key.pem" \
            --output "$output" \
            --algorithms SHA2-256 SHA2-384 SHA2-512 PBKDF
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-demo-verified-results/demo-results.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          if (data.get('status') != 'PASS_DEMO_SAMPLE' or
                  data.get('registration_algorithms') !=
                      ['SHA2-256', 'SHA2-384', 'SHA2-512', 'PBKDF'] or
                  data.get('server_passed') is not True or
                  len(data.get('vectors', [])) < 4 or
                  {item.get('algorithm') for item in data['vectors']} !=
                      {'SHA2-256', 'SHA2-384', 'SHA2-512', 'PBKDF'} or
                  any(item.get('status') != 'SUBMITTED' for item in data['vectors'])):
              raise SystemExit('FAIL: NIST Demo PBKDF did not produce an actual PASS verdict')
          print('PASS: NIST Demo server returned a passing PBKDF sample verdict')
          PY

      - name: Delete ephemeral NIST certificate and private key
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/acvts-demo-cert.pem" "$RUNNER_TEMP/acvts-demo-key.pem"

      - name: Upload sanitized Demo verdict only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsc-acvp-real-nist-demo-pbkdf-sample
          path: ${{ runner.temp }}/qsc-acvp-demo-verified-results/demo-results.json
          if-no-files-found: warn
          retention-days: 7
