# NIST ACVTS Demo ML-KEM sample. Explicitly gated by an approved GitHub Environment.
name: QSC ACVTS Demo authenticated ML-KEM sample (manual)

on:
  workflow_dispatch:
    inputs:
      qsc_ref:
        description: 'Immutable production QSC source revision'
        required: true
        type: string
        default: '43c8aa2afe9d38c3ddf9bac0107196545981ac28'
      approve_nist_network_session:
        description: 'I authorize one real authenticated NIST Demo sample session'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qsc-acvp-nist-demo-exclusive
  cancel-in-progress: false

jobs:
  authenticated-demo-sample:
    name: NIST Demo ML-KEM sample
    if: github.repository == 'QRCS-CORP/QSC-ACVP'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: acvts-demo

    steps:
      - name: Require explicit operator authorization and protected environment
        shell: bash
        env:
          REQUEST_APPROVAL: ${{ inputs.approve_nist_network_session }}
          DEMO_ENABLED: ${{ vars.ACVTS_DEMO_ENABLED }}
        run: |
          set -euo pipefail
          test "$REQUEST_APPROVAL" = true || { echo 'FAIL: live NIST session not approved in dispatch'; exit 1; }
          test "$DEMO_ENABLED" = true || { echo 'FAIL: protected acvts-demo environment not enabled'; exit 1; }
          echo 'PASS: explicit operator and environment approval'

      - name: Checkout approved QSC qualification adapter
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout immutable QSC dependency read-only
        uses: actions/checkout@v4
        with:
          repository: QRCS-CORP/QSC
          ref: ${{ inputs.qsc_ref }}
          path: dependency/QSC
          persist-credentials: false

      - name: Verify QSC source provenance
        shell: bash
        env:
          REQUIRED_SHA: ${{ inputs.qsc_ref }}
        run: |
          set -euo pipefail
          [[ "$REQUIRED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'FAIL: expected immutable QSC commit SHA'; exit 1; }
          actual="$(git -C dependency/QSC rev-parse HEAD)"
          test "$actual" = "$REQUIRED_SHA" || { echo 'FAIL: QSC source SHA mismatch'; exit 1; }
          echo "QSC_DEPENDENCY_SHA=$actual" >> "$GITHUB_ENV"
          echo 'PASS: pinned QSC dependency revision verified'

      - name: Compile isolated scalar SHA and ML-KEM native backends
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S Source/ACVP -B "$RUNNER_TEMP/qsc-acvts-demo-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQSC_ACVP_TLS_CLASS=3 \
            -DQSC_ACVP_ISA_PROFILE=scalar
          cmake --build "$RUNNER_TEMP/qsc-acvts-demo-build" --target qsc_acvp_hash qsc_acvp_pq --parallel 2
          test -s "$RUNNER_TEMP/qsc-acvts-demo-build/libqsc_acvp_hash.so"
          test -s "$RUNNER_TEMP/qsc-acvts-demo-build/libqsc_acvp_pq.so"
          echo 'PASS: source-pinned SHA and ML-KEM libraries'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify SHA3 and SHAKE native prerequisites and ML-KEM registration offline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("Source/ACVP").resolve()))
          from demo_client import registration
          from local_client import QSC
          from mlkem_client import PARAMETERS

          library = Path(os.environ["RUNNER_TEMP"]) / "qsc-acvts-demo-build/libqsc_acvp_hash.so"
          digest = QSC(library)
          checks = (
              ("SHA3-256", 256, hashlib.sha3_256(b"abc").hexdigest().upper()),
              ("SHA3-512", 512, hashlib.sha3_512(b"abc").hexdigest().upper()),
              ("SHAKE-128", 128, hashlib.shake_128(b"abc").hexdigest(16).upper()),
              ("SHAKE-256", 256, hashlib.shake_256(b"abc").hexdigest(32).upper())
          )
          for name, bits, expected in checks:
              if digest.digest(name, b"abc", bits) != expected:
                  raise SystemExit("FAIL: pinned SHA3/SHAKE ML-KEM prerequisite KAT")

          selected = ("SHA3-256", "SHA3-512", "SHAKE-128", "SHAKE-256", "ML-KEM")
          selection = registration(selected)
          capabilities = selection[1].get("algorithms", []) if len(selection) == 2 else []
          kem_modes = [item for item in capabilities if item.get("algorithm") == "ML-KEM"]
          if (len(selection) != 2 or selection[1].get("isSample") is not True or
                  [item.get("algorithm") for item in capabilities[:4]] != list(selected[:4]) or
                  [item.get("mode") for item in kem_modes] != ["keyGen", "encapDecap"] or
                  [item.get("revision") for item in kem_modes] !=
                  ["FIPS203", "FIPS203-tr1"] or
                  any(item.get("parameterSets") != list(PARAMETERS) for item in kem_modes) or
                  any(item.get("prereqVals") !=
                      [{"algorithm": "SHA", "valValue": "same"}] for item in kem_modes) or
                  kem_modes[1].get("functions") != ["encapsulation", "decapsulation"] or
                  kem_modes[1].get("keyFormats") != ["expanded"]):
              raise SystemExit("FAIL: ML-KEM supported mode/prerequisite registration")
          print("PASS: SHA3/SHAKE KAT and scoped ML-KEM keyGen/encapDecap registration")
          PY

      - name: Run credential-free ML-KEM ACVP schema and native tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q Source/ACVP
          python -m unittest discover -s Source/ACVP/tests -p test_mlkem_vectors.py -v \
            2>&1 | tee "$RUNNER_TEMP/qsc-acvts-mlkem-schema.log"
          grep -Eq '^Ran 16 tests in' "$RUNNER_TEMP/qsc-acvts-mlkem-schema.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/qsc-acvts-mlkem-schema.log"
          if grep -Eq 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/qsc-acvts-mlkem-schema.log"; then
            echo 'FAIL: ML-KEM ACVP schema regressions incomplete' >&2
            exit 1
          fi
          export QSC_ACVP_PQ_LIBRARY="$RUNNER_TEMP/qsc-acvts-demo-build/libqsc_acvp_pq.so"
          python -m unittest discover -s Source/ACVP/tests -p test_mlkem_native.py -v \
            2>&1 | tee "$RUNNER_TEMP/qsc-acvts-mlkem-native.log"
          grep -Eq '^Ran 3 tests in' "$RUNNER_TEMP/qsc-acvts-mlkem-native.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/qsc-acvts-mlkem-native.log"
          if grep -Eq 'FAILED|ERROR|skipped=' "$RUNNER_TEMP/qsc-acvts-mlkem-native.log"; then
            echo 'FAIL: native ML-KEM 512/768/1024 validation incomplete' >&2
            exit 1
          fi
          echo 'PASS: ML-KEM schema and three native parameter-set checks'

      - name: Materialize protected NIST mTLS and TOTP credentials
        shell: bash
        env:
          NIST_CERT_B64: ${{ secrets.ACVTS_DEMO_CERT_B64 }}
          NIST_KEY_B64: ${{ secrets.ACVTS_DEMO_KEY_B64 }}
          NIST_TOTP_SEED_B64: ${{ secrets.ACVTS_DEMO_TOTP_B64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$NIST_CERT_B64" || { echo 'FAIL: missing NIST certificate secret'; exit 1; }
          test -n "$NIST_KEY_B64" || { echo 'FAIL: missing NIST private-key secret'; exit 1; }
          test -n "$NIST_TOTP_SEED_B64" || { echo 'FAIL: missing NIST TOTP seed secret'; exit 1; }
          printf '%s' "$NIST_CERT_B64" | base64 --decode > "$RUNNER_TEMP/acvts-demo-cert.pem"
          printf '%s' "$NIST_KEY_B64" | base64 --decode > "$RUNNER_TEMP/acvts-demo-key.pem"
          openssl x509 -noout -in "$RUNNER_TEMP/acvts-demo-cert.pem" >/dev/null
          openssl pkey -noout -in "$RUNNER_TEMP/acvts-demo-key.pem" >/dev/null
          cert_key="$(openssl x509 -in "$RUNNER_TEMP/acvts-demo-cert.pem" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | awk '{print $1}')"
          private_key="$(openssl pkey -in "$RUNNER_TEMP/acvts-demo-key.pem" -pubout -outform DER | sha256sum | awk '{print $1}')"
          test "$cert_key" = "$private_key" || { echo 'FAIL: NIST mTLS certificate and private key do not match'; exit 1; }
          echo 'PASS: NIST identity material loaded without disclosing credentials'

      - name: Run exactly one live NIST Demo ML-KEM with SHA3 and SHAKE prerequisites
        shell: bash
        env:
          ACVP_TOTP_SEED: ${{ secrets.ACVTS_DEMO_TOTP_B64 }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          output="$RUNNER_TEMP/qsc-acvp-demo-verified-results"
          mkdir -p "$output"
          python Source/ACVP/demo_client.py \
            --library "$RUNNER_TEMP/qsc-acvts-demo-build/libqsc_acvp_hash.so" \
            --pq-library "$RUNNER_TEMP/qsc-acvts-demo-build/libqsc_acvp_pq.so" \
            --cert "$RUNNER_TEMP/acvts-demo-cert.pem" \
            --key "$RUNNER_TEMP/acvts-demo-key.pem" \
            --output "$output" \
            --algorithms SHA3-256 SHA3-512 SHAKE-128 SHAKE-256 ML-KEM
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'qsc-acvp-demo-verified-results/demo-results.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          if (data.get('status') != 'PASS_DEMO_SAMPLE' or
                  data.get('registration_algorithms') !=
                      ['SHA3-256', 'SHA3-512', 'SHAKE-128', 'SHAKE-256', 'ML-KEM'] or
                  data.get('server_passed') is not True or
                  len(data.get('vectors', [])) < 6 or
                  {item.get('algorithm') for item in data['vectors']} !=
                      {'SHA3-256', 'SHA3-512', 'SHAKE-128', 'SHAKE-256', 'ML-KEM'} or
                  {item.get('mode') for item in data['vectors']
                   if item.get('algorithm') == 'ML-KEM'} !=
                      {'keyGen', 'encapDecap'} or
                  any(item.get('status') != 'SUBMITTED' for item in data['vectors'])):
              raise SystemExit('FAIL: NIST Demo ML-KEM did not produce an actual PASS verdict')
          print('PASS: NIST Demo server returned a passing ML-KEM sample verdict')
          PY

      - name: Delete ephemeral NIST certificate and private key
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/acvts-demo-cert.pem" "$RUNNER_TEMP/acvts-demo-key.pem"

      - name: Upload sanitized Demo verdict only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsc-acvp-real-nist-demo-mlkem-sample
          path: ${{ runner.temp }}/qsc-acvp-demo-verified-results/demo-results.json
          if-no-files-found: warn
          retention-days: 7
